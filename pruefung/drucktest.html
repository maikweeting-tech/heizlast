<!doctype html><meta charset="utf-8"><title>Drucktest</title>
<!-- Lädt ein Prüfprojekt in den Browser-Speicher und öffnet die Vorzeigeseite (nur für die Prüfung).
     ?datei=referenz_laasch_kueche.json  (Standard: testprojekt_kita_eg.json), ?tab=projekt usw. -->
<script>
const q = new URLSearchParams(location.search);
const datei = (q.get('datei') || 'testprojekt_kita_eg.json').replace(/[^\w.-]/g, '');
const tab = (q.get('tab') || 'vorzeige').replace(/\W/g, '');
fetch(datei).then(r => r.text()).then(t => { localStorage.setItem('fh21.heizlast.v1', t); location.replace('../index.html#' + tab); });
</script>
