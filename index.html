<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heizlast-Rechner</title>
<meta name="description" content="Raumweise Norm-Heizlast nach DIN EN 12831-1 mit DIN/TS 12831-1 – Lern- und Vorplanungswerkzeug">
<meta name="theme-color" content="#1F2A36">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F2A36'/%3E%3Cpath d='M18 46V22m10 24V22m10 24V22m10 24V22' stroke='%23C0392B' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M12 50h40' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Heizlast-App – Gestaltung. Aufbau wie Wärmeschutz-App, Farben wie Excel-Mappe Kita Wesel:
   Heizung rot C0392B, Navy 1F2A36, hellgraue Flächen. */
:root {
  --rot: #C0392B; --navy: #1F2A36; --gruen: #2F6F43; --gelb: #8a6400;
  --bg: #eef0f2; --flaeche: #ffffff; --flaeche2: #f4f5f7; --linie: #d5d9de; --text: #15191e; --text2: #4f5660;
  --rot-hell: #f9e3e0; --gruen-hell: #e2efda; --gelb-hell: #fbf1d6; --navy-hell: #e4e8ee;
  --akzent: var(--rot); --radius: 10px; --schatten: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --rot: #ef8a7e; --gruen: #77c08f; --gelb: #e0b75a; --navy: #0f151c;
    --bg: #121519; --flaeche: #1c2026; --flaeche2: #232831; --linie: #353b45; --text: #eef1f4; --text2: #a9b1bc;
    --rot-hell: #3c2020; --gruen-hell: #1c3124; --gelb-hell: #3a3018; --navy-hell: #243040;
    --akzent: #c0392b; --schatten: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --rot: #ef8a7e; --gruen: #77c08f; --gelb: #e0b75a; --navy: #0f151c;
  --bg: #121519; --flaeche: #1c2026; --flaeche2: #232831; --linie: #353b45; --text: #eef1f4; --text2: #a9b1bc;
  --rot-hell: #3c2020; --gruen-hell: #1c3124; --gelb-hell: #3a3018; --navy-hell: #243040;
  --akzent: #c0392b; --schatten: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0 0 .75em; }
sub, sup { font-size: .72em; }
[hidden] { display: none !important; }
.zahl, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Kopf und Tabs */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--navy); color: #fff; padding: max(env(safe-area-inset-top), 6px) 16px 0; }
.topbar-zeile { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.topbar-zeile::before { content: ""; width: 6px; height: 28px; border-radius: 3px; background: #C0392B; flex: none; }
#titel { font-weight: 700; font-size: 1.1rem; }
.topbar-sub { font-size: .8rem; opacity: .8; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 12px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; background: transparent; color: #cfd6de; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #C0392B; }
.tabs .zaehler { display: inline-block; min-width: 1.4em; padding: 0 5px; border-radius: 9px; background: rgba(255,255,255,.15); font-size: .75rem; margin-left: 4px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px 16px 64px; }
main.breit { max-width: 1100px; }

/* Grundbausteine */
.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--schatten); }
.karte > :last-child { margin-bottom: 0; }
.hinweis { color: var(--text2); font-size: .9rem; }
.klein { font-size: .85rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border-radius: 8px;
  border: 1.5px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; }
.btn:active { transform: translateY(1px); }
.btn-primaer { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.btn-klein { min-height: 38px; padding: 5px 11px; font-size: .9rem; }
.btn-icon { min-width: 36px; min-height: 36px; padding: 0 6px; border-color: transparent; background: transparent; color: var(--rot); font-size: 1.2rem; }
.knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
:focus-visible { outline: 3px solid var(--rot); outline-offset: 2px; }
label.feld { display: block; font-weight: 600; margin-bottom: 12px; }
label.feld .einh { font-weight: 400; color: var(--text2); }
input[type=text], input[type=date], select, textarea { width: 100%; min-height: 42px; padding: 7px 9px; margin-top: 4px; border-radius: 7px;
  border: 1.5px solid var(--linie); background: var(--flaeche2); color: var(--text); font: inherit; }
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px var(--navy-hell); }
input[readonly] { background: transparent; border-style: dashed; }
.fehlt, .tab .fehlt { border-color: var(--rot) !important; background: var(--rot-hell) !important; }
label.haken.fehlt { outline: 2px solid var(--rot); border-radius: 6px; }
.reihe { display: grid; gap: 0 12px; }
@media (min-width: 560px) { .reihe { grid-template-columns: 1fr 1fr; } }
@media (min-width: 820px) { .reihe.drei { grid-template-columns: 1fr 1fr 1fr; } .reihe.vier { grid-template-columns: repeat(4, 1fr); } }
.radio { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 12px; }
.radio label, .haken { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; cursor: pointer; font-weight: 500; }
.radio input, .haken input { width: 20px; height: 20px; accent-color: var(--rot); margin: 0; }
.ausgabe { display: block; margin-top: 4px; min-height: 42px; padding: 8px 9px; border-radius: 7px; background: var(--navy-hell); font-family: var(--mono); }

/* Tabellen */
.tabwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tab { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tab th, .tab td { padding: 6px 7px; border-bottom: 1px solid var(--linie); text-align: left; vertical-align: middle; }
.tab th { font-size: .74rem; color: var(--text2); background: var(--flaeche2); white-space: nowrap; font-weight: 700; }
.tab th.zahl, .tab td.zahl { text-align: right; white-space: nowrap; }
.tab th.zahl { font-family: inherit; }
.tab input[type=text], .tab select { min-height: 36px; padding: 3px 6px; margin: 0; font-size: .88rem; border-radius: 5px; }
.tab input.z { width: 86px; text-align: right; font-family: var(--mono); }
.tab input.q { min-width: 210px; }
.tab td.lh { white-space: nowrap; }
.tab td.lh input.z { width: 62px; }
.tab td.lh span { margin: 0 3px; color: var(--muted, #5b6470); }
.tab input[readonly] { background: var(--flaeche2, #eef0f3); color: var(--muted, #5b6470); }
.tab input.n { min-width: 150px; }
.tab tr.summe td { font-weight: 700; border-top: 2px solid var(--navy); background: var(--flaeche2); }
.tab tr.gruppe td { background: var(--navy-hell); font-weight: 700; font-size: .8rem; }
.tab tr.unvoll td { background: var(--rot-hell); }
.tab .gewinn { color: var(--gruen); }

/* Status */
.status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.status.ok { background: var(--gruen-hell); color: var(--gruen); }
.status.pr { background: var(--gelb-hell); color: var(--gelb); }
.status.no { background: var(--rot-hell); color: var(--rot); }
.fehlliste { border-left: 4px solid var(--rot); background: var(--rot-hell); padding: 10px 14px; border-radius: 6px; margin: 10px 0; }
.fehlliste h3 { color: var(--rot); margin-bottom: 4px; }
.fehlliste ul { margin: 0; padding-left: 20px; }
.hinweisbox { border-left: 4px solid var(--gelb); background: var(--gelb-hell); padding: 8px 12px; border-radius: 6px; margin: 8px 0; font-size: .9rem; }
.ergebnis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.ergebnis div { background: var(--flaeche2); border-radius: 8px; padding: 8px 10px; }
.ergebnis b { display: block; font-family: var(--mono); font-size: 1.15rem; }
.ergebnis .haupt { background: var(--akzent); color: #fff; }
.formel { font-family: var(--mono); font-size: .88rem; background: var(--flaeche2); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; }
details.auf > summary { cursor: pointer; color: var(--navy); font-weight: 650; }
:root[data-theme="dark"] details.auf > summary { color: var(--text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) details.auf > summary { color: var(--text); } }
dialog { border: 1px solid var(--linie); border-radius: 12px; background: var(--flaeche); color: var(--text); max-width: min(560px, calc(100vw - 32px)); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--navy); color: #fff; padding: 10px 16px;
  border-radius: 8px; max-width: calc(100vw - 32px); transition: transform .25s; z-index: 50; }
#toast.zeigen { transform: translateX(-50%) translateY(0); }

/* ── Vorzeigeseite (Papier, immer hell) ───────────────── */
.blattwrap { overflow-x: auto; }
.blatt { --p-rot: #C0392B; --p-navy: #1F2A36; --p-grau: #eef0f2; --p-linie: #b9c0c8;
  width: 210mm; min-height: 297mm; margin: 0 auto; padding: 16mm 15mm 14mm; background: #fff; color: #15191e;
  font: 9.5pt/1.4 "Segoe UI", Arial, Helvetica, sans-serif; box-shadow: 0 2px 14px rgba(0,0,0,.18); color-scheme: light; }
@media (max-width: 860px) { .blatt { width: auto; min-height: 0; padding: 18px 14px; } }
.blatt.png-modus { width: 210mm !important; padding: 16mm 15mm 14mm !important; box-shadow: none; }
.blatt h2 { font-size: 11pt; color: var(--p-navy); border-bottom: 2px solid var(--p-navy); padding-bottom: 2px; margin: 14px 0 6px; break-after: avoid; }
.blatt h2 .nr { color: var(--p-rot); margin-right: 6px; }
.blatt h3.rw-raum { font-size: 9.5pt; color: var(--p-navy); margin: 12px 0 4px; break-after: avoid; }
.aufbau-zeile td { border-top: 0; padding-top: 0; }
/* Bauteilkatalog: zwei Zeilen je Bauteil, ohne Querscrollen */
.bt-tab { width: 100%; }
.bt-tab tr.bt-kopf td { border-bottom: 0; border-top: 2px solid var(--linie); padding-top: 10px; }
.bt-tab tr.bt-unter td { padding-top: 2px; padding-bottom: 12px; }
.bt-tab td.bt-name { width: 100%; }
.bt-tab td.bt-name input { width: 100%; min-width: 140px; }
.bt-tab select { min-width: 190px; }
.bt-quellen { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 6px; }
.bt-quellen .feld { display: flex; flex-direction: column; gap: 3px; font-size: .85em; }
.bt-quellen input.q { min-width: 0; width: 100%; }
.bt-ungeprueft { margin-bottom: 6px; white-space: normal; }
.bt-tab .aufbau-feld input.q { min-width: 0; }
@media (max-width: 700px) {
  .bt-quellen { grid-template-columns: 1fr; }
  /* Handy: jedes Bauteil als Block, Spaltenköpfe als Beschriftung über dem Feld */
  .bt-tab, .bt-tab tbody, .bt-tab tr { display: block; }
  .bt-tab tr:first-child { display: none; }
  .bt-tab tr.bt-kopf { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 8px; border-top: 2px solid var(--linie); padding-top: 8px; }
  .bt-tab tr.bt-kopf td { display: block; border: 0; padding: 2px 0; }
  .bt-tab tr.bt-kopf td.bt-name { flex: 1 1 85%; }
  .bt-tab tr.bt-kopf td[data-l]::before { content: attr(data-l); display: block; font-size: .72rem; color: var(--muted, #5b6470); }
  .bt-tab tr.bt-unter td { display: block; padding: 4px 0 12px; }
  .bt-tab select { min-width: 0; max-width: 100%; }
}
.aufbau summary { cursor: pointer; font-size: .85em; color: var(--muted, #5b6470); }
.aufbau table { margin: 6px 0 4px; }
.aufbau-feld { display: flex; gap: 8px; align-items: center; font-size: .85em; }
.aufbau-feld input { flex: 1; }
.aufbau-knopf { margin-top: 6px; }
.blatt .aufbau-kurz { font-size: 7.5pt; color: #5b6470; }
/* Gebäudeschnitt */
.schnitt-vorschau svg, .schnitt-block svg { width: 100%; height: auto; max-width: 760px; display: block; }
.schnitt-vorschau { background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 6px; }
.blatt .schnitt-block svg { max-height: 95mm; }
.gs-tab td { vertical-align: middle; }
.gs-tab .schicht-pfeile { white-space: nowrap; }
.gs-tab .schicht-pfeile .btn-icon { width: 28px; font-size: .8rem; color: var(--text); }
.blatt table.nachweise td { font-size: 7.6pt; vertical-align: top; }
.blatt table.nachweise th { font-size: 7.4pt; }
.vz-raeume { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
.blatt p { margin: 0 0 5px; }
.blatt table { width: 100%; border-collapse: collapse; font-size: 8.6pt; margin-bottom: 4px; }
.blatt th, .blatt td { border: 0.5pt solid var(--p-linie); padding: 2.5px 5px; text-align: left; vertical-align: top; }
.blatt th { background: var(--p-navy); color: #fff; font-weight: 600; }
.blatt td.z, .blatt th.z { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.blatt tr { break-inside: avoid; }
.blatt thead { display: table-header-group; }
.blatt tr.summe td { font-weight: 700; background: var(--p-grau); border-top: 1.2pt solid var(--p-navy); }
.blatt tr.ges td { font-weight: 700; background: var(--p-rot); color: #fff; }
.blatt tr.zw td { background: var(--p-grau); font-weight: 600; }
.titelblock { display: grid; grid-template-columns: 1fr auto; border: 1pt solid var(--p-navy); }
.titelblock .kopf { background: var(--p-navy); color: #fff; padding: 8px 10px; }
.titelblock .kopf b { display: block; font-size: 13pt; }
.titelblock .kopf span { font-size: 8.5pt; opacity: .85; }
.titelblock .pos { background: var(--p-rot); color: #fff; padding: 8px 12px; text-align: center; min-width: 30mm; }
.titelblock .pos b { display: block; font-size: 13pt; }
.titelblock .felder { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); }
.titelblock .felder div { padding: 4px 8px; border-top: 0.5pt solid var(--p-linie); border-right: 0.5pt solid var(--p-linie); font-size: 8.8pt; }
.titelblock .felder div:nth-child(4n) { border-right: 0; }
.titelblock .felder small { display: block; color: #5b6470; font-size: 7pt; text-transform: uppercase; letter-spacing: .04em; }
.titelblock .felder .breit { grid-column: span 2; }
.blatt .fw { font-family: Consolas, "Cascadia Mono", monospace; font-size: 8.2pt; }
.blatt .fw td { border: 0; border-bottom: 0.5pt solid #dde1e5; padding: 2px 4px; }
.blatt .fw td.erg { font-weight: 700; color: var(--p-rot); white-space: nowrap; text-align: right; }
.blatt .fw tr.gr td { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; background: var(--p-grau); }
.blatt .ok { color: #2F6F43; font-weight: 700; white-space: nowrap; } .blatt .pr { color: #8a6400; font-weight: 700; white-space: nowrap; } .blatt .no { color: var(--p-rot); font-weight: 700; }
.blatt .warn { border: 1pt solid var(--p-rot); color: var(--p-rot); padding: 5px 8px; margin: 6px 0; break-inside: avoid; }
.blatt .fuss { margin-top: 12px; padding-top: 5px; border-top: 1pt solid var(--p-navy); font-size: 7.8pt; color: #5b6470; display: flex; justify-content: space-between; gap: 10px; break-inside: avoid; }
.blatt .block { break-inside: avoid; }
.blatt ul { margin: 0 0 4px; padding-left: 16px; }
.blatt .hinweis { font-size: 7.8pt; color: #5b6470; }
.blatt .fuss span:last-child { flex: none; white-space: nowrap; }
.radio label span sub { font-size: .72em; }

@media print {
  body { background: #fff; }
  .topbar, .no-print, main > section:not(#tab-vorzeige), #toast, dialog, .vorzeige-steuerung { display: none !important; }
  main { padding: 0; max-width: none; }
  #tab-vorzeige { display: block !important; }
  .blattwrap { overflow: visible; }
  .blatt { width: auto; min-height: 0; padding: 0; box-shadow: none; margin: 0; }
}

/* i-Erklärungen */
.info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin: 0 2px; border-radius: 50%;
  background: var(--navy-hell); color: var(--navy); border: 1px solid var(--linie); font: italic 700 12px/1 Georgia, "Times New Roman", serif;
  cursor: pointer; vertical-align: middle; flex: none; text-transform: none; letter-spacing: 0; position: relative; }
.info::after { content: ""; position: absolute; inset: -10px; } /* größere Tippfläche am Handy */
.info:hover, .info:focus-visible { background: var(--rot); border-color: var(--rot); color: #fff; outline: none; }
:root[data-theme="dark"] .info { color: var(--text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .info { color: var(--text); } }
.ergebnis .haupt .info { background: rgba(255,255,255,.2); color: #fff; border-color: rgba(255,255,255,.5); }
#infobox { position: fixed; z-index: 60; background: var(--flaeche); color: var(--text); border: 1px solid var(--linie); border-left: 4px solid var(--rot);
  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 12px 34px 12px 14px; font-size: .92rem; line-height: 1.45; font-weight: 400; }
#infobox p { margin: 6px 0 0; }
#infobox .info-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
#infobox .info-zeichen { font-family: var(--mono); font-weight: 700; color: var(--rot); font-size: 1.05rem; }
#infobox .info-einh { color: var(--text2); font-size: .85rem; }
#infobox .info-zu { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--text2); font-size: 1.3rem; cursor: pointer; border-radius: 6px; }
#infobox .info-zu:hover { background: var(--flaeche2); }
@media print { .info, #infobox { display: none !important; } }

/* Tab Wärmeschutz: eingebettete Wärmeschutz-App */
.ws-kopf { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.ws-kopf p { margin: 0; }
#ws-rahmen { display: block; width: 100%; min-height: 600px; border: 1px solid var(--linie); border-radius: var(--radius); background: var(--bg); }

</style>
<style id="druckstil"></style>
</head>
<body>
<header class="topbar">
  <div class="topbar-zeile">
    <div>
      <div id="titel">Heizlast-Rechner</div>
      <div class="topbar-sub">Raumweise Norm-Heizlast · DIN EN 12831-1 mit DIN/TS 12831-1</div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="projekt" aria-selected="true">1 Projekt</button>
    <button role="tab" data-tab="waerme" aria-selected="false">2 Wärmeschutz</button>
    <button role="tab" data-tab="bauteile" aria-selected="false">3 Bauteile <span class="zaehler" id="z-bauteile">0</span></button>
    <button role="tab" data-tab="normwerte" aria-selected="false">4 Normwerte</button>
    <button role="tab" data-tab="raum" aria-selected="false">5 Raum eingeben</button>
    <button role="tab" data-tab="tabelle" aria-selected="false">6 Raumtabelle <span class="zaehler" id="z-raeume">0</span></button>
    <button role="tab" data-tab="vorzeige" aria-selected="false">7 Vorzeigeseite</button>
  </nav>
</header>
<main>
  <section id="tab-projekt"></section>
  <section id="tab-waerme" hidden></section>
  <section id="tab-bauteile" hidden></section>
  <section id="tab-normwerte" hidden></section>
  <section id="tab-raum" hidden></section>
  <section id="tab-tabelle" hidden></section>
  <section id="tab-vorzeige" hidden></section>
</main>
<dialog id="dlg"></dialog>
<input type="file" id="datei" accept=".json,application/json" hidden>

const WS_HTML = "<!doctype html>\r\n<html lang=\"de\">\r\n<head>\r\n<meta charset=\"utf-8\">\r\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\r\n<title>Wärmeschutz-Rechner</title>\r\n<meta name=\"description\" content=\"U-Wert, Temperaturverlauf und Mindestwärmeschutz nach DIN EN ISO 6946 / DIN 4108-2\">\r\n<meta name=\"theme-color\" content=\"#9C4A1A\">\r\n<style>\n/* Wärmeschutz-Rechner – Gestaltung.\r\n   Farbsystem wie Schallschutz-Assistent, Akzent: warmes Rost. */\r\n:root {\r\n  --rost: #9C4A1A; --blau: #1F4E79; --gruen: #2F6F43; --rot: #A33232; --gelb: #8a6400;\r\n  --bg: #f4f2ed; --flaeche: #ffffff; --flaeche2: #f8f6f1; --linie: #d9d4c8; --text: #15191e; --text2: #4f5660;\r\n  --rost-hell: #fbe9de; --gruen-hell: #e2efda; --rot-hell: #fbe4e4; --blau-hell: #e6eef6;\r\n  --akzent: var(--rost); --auf-akzent: #fff;\r\n  --radius: 12px; --schatten: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);\r\n  --mono: ui-monospace, \"Cascadia Mono\", Consolas, \"SF Mono\", Menlo, monospace;\r\n  color-scheme: light;\r\n}\r\n@media (prefers-color-scheme: dark) {\r\n  :root:not([data-theme=\"light\"]) {\r\n    --rost: #e79a72; --blau: #7fb0de; --gruen: #77c08f; --rot: #ef8c8c; --gelb: #e0b75a;\r\n    --bg: #121519; --flaeche: #1c2026; --flaeche2: #232831; --linie: #353b45; --text: #eef1f4; --text2: #a9b1bc;\r\n    --rost-hell: #3a2419; --gruen-hell: #1c3124; --rot-hell: #3c2020; --blau-hell: #1d2c3b;\r\n    --akzent: #b06030; --auf-akzent: #fff; --schatten: none; color-scheme: dark;\r\n  }\r\n}\r\n:root[data-theme=\"dark\"] {\r\n  --rost: #e79a72; --blau: #7fb0de; --gruen: #77c08f; --rot: #ef8c8c; --gelb: #e0b75a;\r\n  --bg: #121519; --flaeche: #1c2026; --flaeche2: #232831; --linie: #353b45; --text: #eef1f4; --text2: #a9b1bc;\r\n  --rost-hell: #3a2419; --gruen-hell: #1c3124; --rot-hell: #3c2020; --blau-hell: #1d2c3b;\r\n  --akzent: #b06030; --auf-akzent: #fff; --schatten: none; color-scheme: dark;\r\n}\r\n\r\n* { box-sizing: border-box; }\r\nhtml { -webkit-text-size-adjust: 100%; }\r\nbody {\r\n  margin: 0; background: var(--bg); color: var(--text);\r\n  font: 16px/1.5 system-ui, -apple-system, \"Segoe UI\", Roboto, Arial, sans-serif;\r\n}\r\na { color: var(--blau); }\r\nh1,h2,h3 { line-height: 1.25; margin: 0 0 .5em; }\r\nh2 { font-size: 1.15rem; }\r\np { margin: 0 0 .75em; }\r\nsub, sup { font-size: .72em; }\r\nstrong { font-weight: 700; }\r\n.mono, .zahl { font-family: var(--mono); font-variant-numeric: tabular-nums; }\r\n[hidden] { display: none !important; }\r\n\r\n/* ── Topbar ────────────────────────────────────── */\r\n.topbar {\r\n  position: sticky; top: 0; z-index: 20;\r\n  display: flex; align-items: center; gap: 8px;\r\n  min-height: 60px; padding: max(env(safe-area-inset-top),6px) 16px 6px;\r\n  background: var(--rost); color: #fff;\r\n}\r\n:root[data-theme=\"dark\"] .topbar { background: #6e3a14; }\r\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) .topbar { background: #6e3a14; } }\r\n.topbar-titel { min-width: 0; }\r\n#titel { font-weight: 700; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\r\n.topbar-sub { font-size: .8rem; opacity: .85; }\r\n\r\nmain { max-width: 820px; margin: 0 auto; padding: 16px 16px 64px; outline: none; }\r\n\r\n/* ── Grundbausteine ────────────────────────────── */\r\n.karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--schatten); }\r\n.karte > :last-child { margin-bottom: 0; }\r\n.hinweis { color: var(--text2); font-size: .9rem; }\r\n.klein { font-size: .85rem; }\r\n.pruefen { font-size: .82rem; color: var(--gelb); font-style: italic; }\r\n.pruefen::before { content: \"\\26A0\\FE0F \"; }\r\n\r\n.btn {\r\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px;\r\n  min-height: 48px; padding: 10px 18px; border-radius: 10px;\r\n  border: 1.5px solid var(--linie); background: var(--flaeche); color: var(--text);\r\n  font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation;\r\n}\r\n.btn:active { transform: translateY(1px); }\r\n.btn:disabled { opacity: .45; cursor: not-allowed; }\r\n.btn-primaer { background: var(--akzent); border-color: var(--akzent); color: var(--auf-akzent); }\r\n.btn-gruen { background: var(--gruen); border-color: var(--gruen); color: #fff; }\r\n.btn-klein { min-height: 40px; padding: 6px 12px; font-size: .9rem; }\r\n.btn-voll { width: 100%; }\r\n.btn-icon { width: 40px; min-height: 40px; padding: 0; font-size: 1.3rem; line-height: 1; color: var(--rot); border-color: transparent; background: transparent; }\r\n.btn-icon:hover { background: var(--rot-hell); }\r\n.schicht-knoepfe { white-space: nowrap; padding-left: 0 !important; padding-right: 0 !important; }\r\n.schicht-knoepfe .btn-hoch, .schicht-knoepfe .btn-runter { width: 30px; font-size: .85rem; color: var(--text, #1f2933); }\r\n.schicht-knoepfe .btn-hoch:hover, .schicht-knoepfe .btn-runter:hover { background: var(--linie, #e3e6ea); }\r\n#schichten tr:first-child .btn-hoch, #schichten tr:last-child .btn-runter { visibility: hidden; }\r\n:focus-visible { outline: 3px solid var(--rost); outline-offset: 2px; }\r\n\r\n/* ── Formulare ─────────────────────────────────── */\r\nlabel.feld { display: block; font-weight: 600; margin-bottom: 14px; }\r\nlabel.feld .einheit-label { font-weight: 400; color: var(--text2); }\r\ninput[type=text], input[type=number], select {\r\n  width: 100%; min-height: 44px; padding: 8px 10px; margin-top: 4px; border-radius: 8px;\r\n  border: 1.5px solid var(--linie); background: var(--flaeche2); color: var(--text); font: inherit;\r\n}\r\ninput:focus, select:focus { border-color: var(--rost); outline: none; box-shadow: 0 0 0 3px var(--rost-hell); }\r\ninput:disabled { opacity: .5; }\r\n.reihe { display: grid; gap: 12px; }\r\n@media (min-width: 520px) { .reihe { grid-template-columns: 1fr 1fr; } }\r\n@media (min-width: 720px) { .reihe.drei { grid-template-columns: 1fr 1fr 1fr; } }\r\n\r\n/* ── Details / Akkordeon ───────────────────────── */\r\ndetails.extra { margin-top: 14px; }\r\ndetails.extra > summary {\r\n  cursor: pointer; font-weight: 650; color: var(--rost); list-style: none; display: flex; align-items: center; gap: 6px;\r\n}\r\ndetails.extra > summary::-webkit-details-marker { display: none; }\r\ndetails.extra > summary::before { content: \"\\25B6\"; font-size: .7em; transition: transform .2s; }\r\ndetails.extra[open] > summary::before { transform: rotate(90deg); }\r\ndetails.extra .inhalt { padding-top: 12px; }\r\n\r\n.schalter { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 600; }\r\n.schalter input { width: 22px; height: 22px; accent-color: var(--rost); flex: none; margin: 0; }\r\n\r\n/* ── Schichttabelle (Eingabe) ──────────────────── */\r\n.tabwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }\r\ntable.tab { width: 100%; border-collapse: collapse; font-size: .92rem; }\r\n.tab th, .tab td { padding: 7px 8px; border-bottom: 1px solid var(--linie); text-align: left; vertical-align: middle; }\r\n.tab th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); background: var(--flaeche2); white-space: nowrap; }\r\n.tab td.zahl, .tab th.zahl { text-align: right; white-space: nowrap; }\r\n.tab input[type=text], .tab input[type=number], .tab select {\r\n  min-height: 38px; padding: 4px 6px; margin: 0; font-size: .9rem; border-radius: 6px;\r\n}\r\n.tab .s-name   { min-width: 120px; }\r\n.tab .s-stoff  { min-width: 200px; font-size: .82rem; }\r\n.tab .s-stoff + .s-name:not([hidden]) { margin-top: 4px; }\r\n.tab .s-d      { width: 72px; }\r\n.tab .s-lambda { width: 90px; }\r\n.tab .s-mu     { width: 84px; }\r\n.tab .s-quelle { min-width: 100px; font-size: .82rem; }\r\n.tab .typ-sel  { min-width: 96px; font-size: .82rem; }\r\n\r\n/* ── Ergebnis-Karten ───────────────────────────── */\r\n.erg-titel { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); font-weight: 700; margin: 0 0 8px; }\r\n.rechenweg {\r\n  font-family: var(--mono); font-size: .88rem; background: var(--flaeche2); border: 1px solid var(--linie);\r\n  border-left: 4px solid var(--rost); border-radius: 8px; padding: 12px 14px; overflow-x: auto; white-space: pre-wrap; line-height: 1.6;\r\n}\r\n.rechenweg .erg { color: var(--rost); font-weight: 800; }\r\n.ergebnis-gross { font-family: var(--mono); font-size: 2rem; font-weight: 800; color: var(--rost); line-height: 1.1; margin: 8px 0; }\r\n.ergebnis-gross small { font-size: .9rem; font-weight: 600; color: var(--text2); }\r\n\r\n.ampel { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius); font-weight: 700; border: 2px solid; }\r\n.ampel .licht { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 1.1rem; }\r\n.ampel.ok { background: var(--gruen-hell); border-color: var(--gruen); color: var(--gruen); }\r\n.ampel.ok .licht { background: #2F6F43; }\r\n.ampel.nok { background: var(--rot-hell); border-color: var(--rot); color: var(--rot); }\r\n.ampel.nok .licht { background: #A33232; }\r\n\r\n.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .85rem; }\r\n.badge.ok { background: var(--gruen-hell); color: var(--gruen); }\r\n.badge.nok { background: var(--rot-hell); color: var(--rot); }\r\n\r\n.check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linie); font-size: .92rem; }\r\n.check-item:last-child { border-bottom: none; }\r\n.check-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 6px; }\r\n.check-dot.ok { background: var(--gruen); }\r\n.check-dot.warn { background: var(--rot); }\r\n\r\n.annahme { font-size: .82rem; color: var(--gelb); margin-top: 10px; }\r\n.annahme::before { content: \"Annahme: \"; font-weight: 700; }\r\n\r\n.hinweis-box { background: var(--rost-hell); border-left: 4px solid var(--rost); padding: 12px 14px; border-radius: 8px; margin-top: 12px; font-size: .9rem; }\r\n\r\n/* Ergebnis-Tabelle (Temperaturen, Nachweis) */\r\n.tab tr.kontrolle td { border-top: 2px solid var(--rost); font-weight: 700; color: var(--rost); }\r\n.tab tr.markiert td { background: var(--rost-hell); }\r\n\r\n/* Aufgabe-Leiste */\r\n.aufgabe { display: grid; gap: 4px 12px; align-items: end; }\r\n.aufgabe label.feld { margin-bottom: 0; }\r\n.aufgabe-knoepfe { display: flex; gap: 8px; flex-wrap: wrap; }\r\n@media (min-width: 620px) { .aufgabe { grid-template-columns: 1fr auto; } }\r\n.fenster-uebergabe { margin-top: 8px; }\r\n.fenster-uebergabe summary { cursor: pointer; font-weight: 600; font-size: .92rem; }\r\n.fenster-felder { display: grid; gap: 4px 12px; margin: 8px 0; }\r\n@media (min-width: 620px) { .fenster-felder { grid-template-columns: 9rem 12rem 1fr; } .fenster-felder .fenster-quelle { grid-column: 1 / -1; } }\r\n\r\n/* Temperaturgrafik */\r\n.massstab { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }\r\n.massstab .btn[aria-pressed=\"true\"] { background: var(--akzent); border-color: var(--akzent); color: var(--auf-akzent); }\r\nsvg.grafik { width: 100%; height: auto; display: block; margin-bottom: 12px; font-family: system-ui, sans-serif; }\r\n.grafik .g-luft-i, .grafik .g-luft-a { fill: var(--flaeche2); }\r\n.grafik .g-schicht { stroke: var(--text2); stroke-width: .8; }\r\n.grafik .g-raster { stroke: var(--linie); stroke-width: 1; }\r\n.grafik .g-null { stroke: var(--blau); stroke-width: 1.2; stroke-dasharray: 5 4; }\r\n.grafik .g-achse { fill: var(--text2); font-size: 11px; text-anchor: end; }\r\n.grafik .g-nr, .grafik .g-seite { fill: var(--text2); font-size: 11px; text-anchor: middle; }\r\n.grafik .g-linie { fill: none; stroke: var(--rot); stroke-width: 2.5; stroke-linejoin: round; }\r\n.grafik .g-punkt { fill: var(--rot); stroke: var(--flaeche); stroke-width: 1.5; }\r\n.grafik .g-psat { fill: none; stroke: var(--blau); stroke-width: 2.5; stroke-dasharray: 7 4; }\r\n.grafik .g-tau { fill: var(--rot); fill-opacity: .35; stroke: var(--rot); stroke-width: 2.5; }\r\n.grafik .g-wert { fill: var(--text); font-size: 11px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--flaeche); stroke-width: 3px; }\r\n\r\n/* ── Toast ─────────────────────────────────────── */\r\n#toast {\r\n  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;\r\n  background: #222; color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: 600;\r\n  transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center;\r\n}\r\n#toast.zeigen { opacity: 1; transform: translateX(-50%); }\r\n\r\n/* ── Responsive ────────────────────────────────── */\r\n@media (min-width: 720px) {\r\n  main { padding-left: 24px; padding-right: 24px; }\r\n}\r\n@media print {\r\n  @page { size: A4; margin: 15mm 14mm; }\r\n  body { background: #fff; color: #000; font-size: 10.5pt; }\r\n  .topbar, #toast, .no-print { display: none !important; }\r\n  .karte { box-shadow: none; break-inside: avoid; border: 1px solid #ccc; }\r\n  .rechenweg { border-left-color: #9C4A1A; }\r\n  .ampel.ok { border-color: #2F6F43; } .ampel.nok { border-color: #A33232; }\r\n}\r\n\r\n/* Eingebettet in der Heizlast-App: eigene Kopfzeile und Teilen-Link ausblenden */\r\n.eingebettet .topbar, .eingebettet #btn-link, .eingebettet .aufgabe ~ .hinweis { display: none !important; }\r\n.eingebettet main { padding-top: 4px; }\r\n.eingebettet .fehlt, .tab .fehlt { border-color: var(--rot) !important; background: var(--rot-hell) !important; }\r\n\r\n/* i-Erklärungen */\r\n.info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin: 0 2px; border-radius: 50%;\r\n  background: var(--blau-hell); color: var(--blau); border: 1px solid var(--linie); font: italic 700 12px/1 Georgia, \"Times New Roman\", serif;\r\n  cursor: pointer; vertical-align: middle; flex: none; text-transform: none; letter-spacing: 0; position: relative; }\r\n.info::after { content: \"\"; position: absolute; inset: -10px; }\r\n.info:hover, .info:focus-visible { background: var(--rost); border-color: var(--rost); color: #fff; outline: none; }\r\n#infobox { position: fixed; z-index: 60; background: var(--flaeche); color: var(--text); border: 1px solid var(--linie); border-left: 4px solid var(--rost);\r\n  border-radius: 10px; box-shadow: 0 8px 28px rgba(0,0,0,.22); padding: 12px 34px 12px 14px; font-size: .92rem; line-height: 1.45; font-weight: 400; text-transform: none; letter-spacing: 0; }\r\n#infobox p { margin: 6px 0 0; }\r\n#infobox .info-kopf { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }\r\n#infobox .info-zeichen { font-family: var(--mono); font-weight: 700; color: var(--rost); font-size: 1.05rem; }\r\n#infobox .info-einh { color: var(--text2); font-size: .85rem; }\r\n#infobox .info-zu { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border: 0; background: transparent; color: var(--text2); font-size: 1.3rem; cursor: pointer; border-radius: 6px; }\r\n@media print { .info, #infobox { display: none !important; } }\r\n\n@media not all and (prefers-color-scheme: dark) { :root { --rost: #C0392B; --rost-hell: #f9e3e0; --akzent: #C0392B; --bg: #eef0f2; } }\n</style>\r\n</head>\r\n<body>\r\n\r\n<header class=\"topbar\">\r\n  <div class=\"topbar-titel\">\r\n    <div id=\"titel\">Wärmeschutz-Rechner</div>\r\n    <div class=\"topbar-sub\">U-Wert · Temperaturverlauf · Mindestwärmeschutz</div>\r\n  </div>\r\n</header>\r\n\r\n<main>\r\n\r\n  <!-- ── Aufgabe ──────────────────────────────── -->\r\n  <section class=\"karte no-print\">\r\n    <div class=\"aufgabe\">\r\n      <label class=\"feld\">Beispiel laden <span data-i=\"beispiel\"></span>\r\n        <select id=\"beispiel\"><option value=\"\">— Vorlage oder Beispiel wählen —</option></select>\r\n      </label>\r\n      <div class=\"aufgabe-knoepfe\">\r\n        <button type=\"button\" class=\"btn btn-klein\" id=\"btn-link\">Link teilen</button>\r\n        <button type=\"button\" class=\"btn btn-klein\" id=\"btn-druck\">Drucken / PDF</button>\r\n        <button type=\"button\" class=\"btn btn-klein\" id=\"btn-heizlast\">An Heizlast-App übergeben</button> <span data-i=\"heizlast\"></span>\r\n      </div>\r\n    </div>\r\n    <p class=\"hinweis klein\">„Link teilen“ kopiert einen Link mit allen Eingaben – z.B. als Aufgabe für die Klasse. „An Heizlast-App übergeben“ speichert das Bauteil mit U-Wert für die Heizlast-App und lädt es zusätzlich als JSON-Datei herunter. Vorlagen sind Vorschläge: Schichtdicken an das Projekt anpassen.</p>\r\n    <details class=\"fenster-uebergabe\">\r\n      <summary>Fenster oder Außentür übergeben (U_w aus Herstellerangabe, ohne Schichten)</summary>\r\n      <div class=\"fenster-felder\">\r\n        <label class=\"feld\">Art <select id=\"fenster-art\"><option>Fenster</option><option>Außentür</option></select></label>\r\n        <label class=\"feld\">U_w bzw. U_D in W/(m²K) <select id=\"fenster-uw\"></select></label>\r\n        <label class=\"feld\">Name <input type=\"text\" id=\"fenster-name\" placeholder=\"z. B. Fenster 3-fach U_w 0,9\"></label>\r\n        <label class=\"feld fenster-quelle\">Quelle U_w (Pflicht) <input type=\"text\" id=\"fenster-quelle\" placeholder=\"z. B. Herstellerdatenblatt …, U_w nach DIN EN ISO 10077-1\"></label>\r\n      </div>\r\n      <button type=\"button\" class=\"btn btn-klein\" id=\"btn-fenster\">Fenster an Heizlast-App übergeben</button>\r\n    </details>\r\n  </section>\r\n\r\n  <!-- ── Randbedingungen ──────────────────────── -->\r\n  <section class=\"karte\">\r\n    <h2>Randbedingungen</h2>\r\n    <div class=\"reihe drei\">\r\n      <label class=\"feld\">Bauteil <span data-i=\"bauteil\"></span><select id=\"bauteil\"></select></label>\r\n      <label class=\"feld\">Raumnutzung <span data-i=\"raumnutzung\"></span>\r\n        <select id=\"raum\">\r\n          <option value=\"normal\">Normal beheizt (θ_i ≥ 19 °C)</option>\r\n          <option value=\"niedrig\">Niedrig beheizt (12…19 °C)</option>\r\n        </select>\r\n      </label>\r\n      <label class=\"feld\">Wärmestromrichtung <span data-i=\"richtung\"></span>\r\n        <select id=\"richtung\">\r\n          <option value=\"horizontal\">horizontal</option>\r\n          <option value=\"aufwaerts\">aufwärts</option>\r\n          <option value=\"abwaerts\">abwärts</option>\r\n        </select>\r\n      </label>\r\n    </div>\r\n    <div class=\"reihe\">\r\n      <label class=\"feld\">Außenseite grenzt an <span data-i=\"aussenseite\"></span>\r\n        <select id=\"aussenseite\">\r\n          <option value=\"luft\">Außenluft</option>\r\n          <option value=\"erdreich\">Erdreich (R_se = 0)</option>\r\n          <option value=\"innen\">Innenraum / unbeheizter Raum (Keller) / belüftete Luftschicht (R_se = R_si)</option>\r\n        </select>\r\n      </label>\r\n    </div>\r\n    <div class=\"reihe drei\">\r\n      <label class=\"feld\">θ<sub>i</sub> <span data-i=\"theta_i\"></span> <span class=\"einheit-label\">[°C]</span>\r\n        <input type=\"number\" id=\"theta-i\" value=\"20\" step=\"any\">\r\n      </label>\r\n      <label class=\"feld\">θ<sub>e</sub> <span data-i=\"theta_e\"></span> <span class=\"einheit-label\">[°C]</span>\r\n        <input type=\"number\" id=\"theta-e\" value=\"-5\" step=\"any\">\r\n      </label>\r\n      <label class=\"feld\">DIN 4108-2 <span data-i=\"din\"></span>\r\n        <select id=\"din-ausgabe\">\r\n          <option value=\"2013-02\">2013-02</option>\r\n          <option value=\"2026-05\">2026-05</option>\r\n        </select>\r\n      </label>\r\n    </div>\r\n    <div class=\"reihe\">\r\n      <label class=\"feld\">Anforderung GModG <span data-i=\"gmodg\"></span>\r\n        <select id=\"gmodg-fall\">\r\n          <option value=\"bestand\">Änderung im Bestand (§ 36, Anlage 7)</option>\r\n          <option value=\"neubau\">Neubau (Orientierung: Referenzgebäude, Anlage 1)</option>\r\n          <option value=\"keine\">keine Prüfung</option>\r\n        </select>\r\n      </label>\r\n      <label class=\"feld\" id=\"gmodg-zeile-feld\">Maßnahme (Anlage 7) <span data-i=\"anl7\"></span>\r\n        <select id=\"gmodg-zeile\"></select>\r\n      </label>\r\n    </div>\r\n  </section>\r\n\r\n  <!-- ── Schichtaufbau ────────────────────────── -->\r\n  <section class=\"karte\">\r\n    <h2>Schichtaufbau <span class=\"hinweis\">(innen → außen)</span></h2>\r\n    <div class=\"tabwrap\">\r\n      <table class=\"tab\" id=\"tab-schichten\">\r\n        <thead><tr>\r\n          <th class=\"no-print\" title=\"Reihenfolge innen → außen\"></th>\r\n          <th class=\"zahl\">Nr.</th>\r\n          <th>Typ <span data-i=\"typ\"></span></th>\r\n          <th>Baustoff <span data-i=\"baustoff\"></span></th>\r\n          <th class=\"zahl\">d <span data-i=\"d\"></span> [cm]</th>\r\n          <th class=\"zahl\">λ <span data-i=\"lambda\"></span> [W/(mK)]</th>\r\n          <th class=\"zahl\">μ <span data-i=\"mu\"></span> [–]</th>\r\n          <th>Quelle <span data-i=\"quelle\"></span></th>\r\n          <th></th>\r\n        </tr></thead>\r\n        <tbody id=\"schichten\"></tbody>\r\n      </table>\r\n    </div>\r\n    <button type=\"button\" class=\"btn btn-klein no-print\" id=\"btn-add\" style=\"margin-top:10px\">+ Schicht</button>\r\n  </section>\r\n\r\n  <!-- ── Korrekturwerte ───────────────────────── -->\r\n  <section class=\"karte\">\r\n    <details class=\"extra\" id=\"det-korr\">\r\n      <summary>Korrekturwerte ΔU <span data-i=\"korrektur\"></span></summary>\r\n      <div class=\"inhalt\">\r\n\r\n        <h3>Luftspalte in der Dämmung (ΔU<sub>g</sub>) <span data-i=\"dUg\"></span></h3>\r\n        <div class=\"reihe\">\r\n          <label class=\"feld\">Korrekturstufe <span data-i=\"lustufe\"></span>\r\n            <select id=\"lu-stufe\">\r\n              <option value=\"0\" selected>Stufe 0 – keine Korrektur</option>\r\n              <option value=\"1\">Stufe 1 – ΔU″ = 0,01</option>\r\n              <option value=\"2\">Stufe 2 – ΔU″ = 0,04</option>\r\n            </select>\r\n          </label>\r\n          <label class=\"feld\">Betroffene Dämmschicht Nr. <span data-i=\"luschicht\"></span>\r\n            <input type=\"number\" id=\"lu-schicht\" min=\"1\" step=\"1\" placeholder=\"z.B. 2\">\r\n          </label>\r\n        </div>\r\n\r\n        <h3 style=\"margin-top:18px\">Befestigungselemente (ΔU<sub>f</sub>) <span data-i=\"dUf\"></span></h3>\r\n        <label class=\"schalter\"><input type=\"checkbox\" id=\"bef-aktiv\"> Befestigungselemente vorhanden</label>\r\n        <div id=\"bef-felder\" hidden>\r\n          <div class=\"reihe drei\">\r\n            <label class=\"feld\">n<sub>f</sub> <span data-i=\"nf\"></span> <span class=\"einheit-label\">[1/m²]</span>\r\n              <input type=\"number\" id=\"bef-nf\" step=\"any\" min=\"0\">\r\n            </label>\r\n            <label class=\"feld\">Ø <span data-i=\"df\"></span> <span class=\"einheit-label\">[mm]</span>\r\n              <input type=\"number\" id=\"bef-dm\" step=\"any\" min=\"0\">\r\n            </label>\r\n            <label class=\"feld\">λ<sub>f</sub> <span data-i=\"lambdaf\"></span> <span class=\"einheit-label\">[W/(mK)]</span>\r\n              <input type=\"number\" id=\"bef-lambda\" step=\"any\" min=\"0\">\r\n            </label>\r\n          </div>\r\n          <div class=\"reihe drei\">\r\n            <label class=\"schalter\"><input type=\"checkbox\" id=\"bef-voll\" checked> Volle Durchdringung (d₁ = d₀) <span data-i=\"voll\"></span></label>\r\n            <label class=\"feld\">Durchdrungene Schicht Nr. <span data-i=\"befschicht\"></span>\r\n              <input type=\"number\" id=\"bef-schicht\" min=\"1\" step=\"1\" placeholder=\"z.B. 2\">\r\n            </label>\r\n            <label class=\"feld\" id=\"bef-d1-feld\" hidden>Eindringtiefe d₁ <span class=\"einheit-label\">[cm]</span>\r\n              <input type=\"number\" id=\"bef-d1\" step=\"any\" min=\"0\">\r\n            </label>\r\n          </div>\r\n          <p class=\"hinweis klein\">Näherungsverfahren nach Schneider 26, Tafel 4.6a: ΔU<sub>f</sub> = α·λ<sub>f</sub>·n<sub>f</sub>·A<sub>f</sub>/d₀ · (R₁/R<sub>T,h</sub>)² mit α = 0,8·d₁/d₀.</p>\r\n        </div>\r\n\r\n        <h3 style=\"margin-top:18px\">Umkehrdach (ΔU<sub>r</sub>) <span data-i=\"dUr\"></span></h3>\r\n        <div class=\"reihe\">\r\n          <label class=\"feld\">Dämmschicht über der Abdichtung Nr. <span data-i=\"urschicht\"></span>\r\n            <input type=\"number\" id=\"ur-schicht\" min=\"1\" step=\"1\" placeholder=\"leer = manuell\">\r\n          </label>\r\n          <label class=\"feld\">oder ΔU<sub>r</sub> manuell <span data-i=\"dUr\"></span> <span class=\"einheit-label\">[W/(m²K)]</span>\r\n            <input type=\"number\" id=\"delta-ur\" value=\"0\" step=\"any\" min=\"0\">\r\n          </label>\r\n        </div>\r\n        <p class=\"hinweis\">Mit Schichtnummer: ΔU<sub>r</sub> nach DIN 4108-2 (Schneider 26, Tafel 4.6b) aus dem Anteil (R<sub>T</sub> − R<sub>i</sub>)/R<sub>T</sub>: unter 10 % → 0,05; 10 bis 50 % → 0,03; über 50 % → 0.</p>\r\n      </div>\r\n    </details>\r\n  </section>\r\n\r\n  <!-- ── Inhomogene Schicht ───────────────────── -->\r\n  <section class=\"karte\">\r\n    <details class=\"extra\" id=\"det-inhom\">\r\n      <summary>Inhomogene Schicht (z.B. Sparren / Gefach) <span data-i=\"inhom\"></span></summary>\r\n      <div class=\"inhalt\">\r\n        <label class=\"schalter\"><input type=\"checkbox\" id=\"inhom-aktiv\"> Inhomogene Schicht vorhanden</label>\r\n        <div id=\"inhom-felder\" hidden>\r\n          <div class=\"reihe\">\r\n            <label class=\"feld\">Schicht Nr. <span data-i=\"inhomnr\"></span>\r\n              <input type=\"number\" id=\"inhom-nr\" min=\"1\" step=\"1\">\r\n            </label>\r\n            <label class=\"feld\">Material B <span data-i=\"materialB\"></span>\r\n              <input type=\"text\" id=\"inhom-name\" placeholder=\"z.B. KVH C24\">\r\n            </label>\r\n          </div>\r\n          <div class=\"reihe drei\">\r\n            <label class=\"feld\">λ<sub>B</sub> <span data-i=\"lambdaB\"></span> <span class=\"einheit-label\">[W/(mK)]</span>\r\n              <input type=\"number\" id=\"inhom-lambda\" step=\"any\" min=\"0\">\r\n            </label>\r\n            <label class=\"feld\">f<sub>a</sub> <span data-i=\"fa\"></span> <span class=\"einheit-label\">(Anteil A)</span>\r\n              <input type=\"number\" id=\"inhom-fa\" step=\"any\" min=\"0\" max=\"1\" placeholder=\"0,88\">\r\n            </label>\r\n            <label class=\"feld\">f<sub>b</sub> <span data-i=\"fb\"></span> <span class=\"einheit-label\">(Anteil B)</span>\r\n              <input type=\"number\" id=\"inhom-fb\" step=\"any\" min=\"0\" max=\"1\" placeholder=\"0,12\">\r\n            </label>\r\n          </div>\r\n          <p class=\"hinweis\">f<sub>a</sub> + f<sub>b</sub> = 1,0. Material A = Stoff in der Schichttabelle oben.</p>\r\n        </div>\r\n      </div>\r\n    </details>\r\n  </section>\r\n\r\n  <!-- ── Berechnen ────────────────────────────── -->\r\n  <button type=\"button\" class=\"btn btn-primaer btn-voll no-print\" id=\"btn-calc\" style=\"margin-bottom:20px\">Berechnen</button>\r\n\r\n  <!-- ── Ergebnisse ───────────────────────────── -->\r\n  <div id=\"ergebnis\" hidden></div>\r\n\r\n</main>\r\n\r\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\r\n\r\n<script>\n'use strict';\n/* Wärmeschutz-Rechner – Daten und Nachschlagetabellen\n   Quellen-Kürzel: Z = zitiert, G = aus dem Gedächtnis – prüfen! */\n\n// Wärmeübergangswiderstände [m²K/W]\n// DIN EN ISO 6946:2018-03, Tabelle 7 (Wärmeschutz, nicht Feuchteschutz) – Z, Schneider 26, Tafel 4.4a\nconst RSI_RSE = {\n  horizontal: { rsi: 0.13, rse: 0.04 },\n  aufwaerts:  { rsi: 0.10, rse: 0.04 },\n  abwaerts:   { rsi: 0.17, rse: 0.04 }\n};\n// Außenseite des Bauteils → R_se (DIN EN ISO 6946; Schneider 26, Tafel 4.4a)\n// luft: R_se wie oben; erdreich: R_se = 0; innen: angrenzender Innenraum/unbeheizter Raum (z. B. Keller) → R_se = R_si\n// G: Werte für Erdreich und Innenraum aus dem Gedächtnis – gegen Tafel 4.4a prüfen, dann geprueft setzen\nconst AUSSENSEITE = {\n  luft:     { label: 'Außenluft' },\n  erdreich: { label: 'Erdreich' },\n  innen:    { label: 'Innenraum / unbeheizter Raum (Keller) / belüftete Luftschicht' }\n};\n// vom Nutzer gegen Schneider 26, Tafel 4.4a geprüft (22.11.2026)\nconst AUSSENSEITE_QUELLE = { text: 'DIN EN ISO 6946; Schneider 26, Tafel 4.4a', geprueft: '22.11.2026' };\n\n// Ruhende (unbelüftete) Luftschichten [mm → m²K/W]\n// DIN EN ISO 6946:2018-03, Tabelle 2 – G\nconst LUFT_R = {\n  horizontal: [[0,0],[5,0.11],[7,0.13],[10,0.15],[15,0.17],[25,0.18],[50,0.18],[100,0.18],[300,0.18]],\n  aufwaerts:  [[0,0],[5,0.11],[7,0.13],[10,0.15],[15,0.16],[25,0.16],[50,0.16],[100,0.16],[300,0.16]],\n  abwaerts:   [[0,0],[5,0.11],[7,0.13],[10,0.15],[15,0.17],[25,0.19],[50,0.21],[100,0.22],[300,0.23]]\n};\n\n// Bauteiltypen mit Standard-Wärmestromrichtung\n// anl7: passende Zeilen der GModG-Anlage 7 (erste = Vorauswahl), refKey: Referenzgebäude Anlage 1\nconst BAUTEILE = [\n  { id:'aussenwand',         label:'Außenwand',                               richtung:'horizontal', rminKey:'aussenwand',      anl7:['1b','1a'],      refKey:'aussenwand' },\n  { id:'steildach',          label:'Steildach',                               richtung:'aufwaerts',  rminKey:'dach',            anl7:['5b','5a'],      refKey:'dach' },\n  { id:'flachdach',          label:'Flachdach',                               richtung:'aufwaerts',  rminKey:'dach',            anl7:['5c','5a'],      refKey:'dach' },\n  { id:'decke_aussen_oben',  label:'Decke gegen Außenluft (Wärmestrom ↑)',richtung:'aufwaerts',  rminKey:'decke_aussen',    anl7:['5a'],           refKey:'aussenwand' },\n  { id:'decke_aussen_unten', label:'Decke gegen Außenluft (Wärmestrom ↓)',richtung:'abwaerts',   rminKey:'decke_aussen',    anl7:['6e','6d','6c'], refKey:'aussenwand' },\n  { id:'decke_unbeheizt',    label:'Decke unter nicht ausg. Dachraum',        richtung:'aufwaerts',  rminKey:'decke_unbeheizt', anl7:['5a'],           refKey:'dach' },\n  { id:'kellerdecke',        label:'Kellerdecke / gegen Erdreich',            richtung:'abwaerts',   rminKey:'kellerdecke',     anl7:['6b','6a','6c'], refKey:'erdreich' }\n];\n\n// Gebäudemodernisierungsgesetz (GModG) – Z (zitiert aus den nichtamtlichen Lesefassungen\n// gültig 29.07.–31.12.2026 und ab 01.01.2027 (BBSR, gmodg.bund.de): § 36, Anlage 7 und Anlage 1\n// sind in beiden Fassungen gleich; Abgleich mit Schneider 26, Tafel 4.16)\n// § 36 mit Anlage 7: Höchstwerte U_max [W/(m²K)] bei Änderung bestehender Gebäude.\n// hoch = Wohngebäude bzw. Zonen ≥ 19 °C, niedrig = Zonen 12 bis < 19 °C (null = keine Anforderung)\nconst GMODG = {\n  stand: 'GModG, nichtamtliche Lesefassungen gültig ab 29.07.2026 und ab 01.01.2027 (§ 36, Anlage 7 und Anlage 1 unverändert)',\n  anl7: [\n    { id:'1a', text:'Außenwand – Ersatz oder erstmaliger Einbau',                                        hoch:0.24, niedrig:0.35, fn:[1] },\n    { id:'1b', text:'Außenwand – außenseitige Dämmung, Bekleidung oder neuer Außenputz',                  hoch:0.24, niedrig:0.35, fn:[1,2] },\n    { id:'5a', text:'Dach, oberste Geschossdecke, Abseitenwand – Ersatz oder erstmaliger Einbau',          hoch:0.24, niedrig:0.35, fn:[1] },\n    { id:'5b', text:'Dach – neue Dachdeckung oder Bekleidung/Dämmung auf der Kaltseite',                  hoch:0.24, niedrig:0.35, fn:[1,5] },\n    { id:'5c', text:'Dach mit Abdichtung (Flachdach) – Ersatz der Abdichtung',                             hoch:0.20, niedrig:0.35, fn:[1,5] },\n    { id:'6a', text:'Wand/Decke gegen Erdreich oder unbeheizte Räume – Ersatz oder erstmaliger Einbau',    hoch:0.30, niedrig:null, fn:[1] },\n    { id:'6b', text:'Wand/Decke gegen Erdreich oder unbeheizt – Bekleidung/Dämmung auf der Kaltseite',     hoch:0.30, niedrig:null, fn:[1,5] },\n    { id:'6c', text:'Decke nach unten – Fußbodenaufbau auf der beheizten Seite',                           hoch:0.50, niedrig:null, fn:[1,5] },\n    { id:'6d', text:'Decke nach unten zur Außenluft – Ersatz oder erstmaliger Einbau',                     hoch:0.24, niedrig:0.35, fn:[1] },\n    { id:'6e', text:'Decke nach unten zur Außenluft – Bekleidung/Dämmung erneuert',                        hoch:0.24, niedrig:0.35, fn:[1,5] },\n  ],\n  fussnoten: {\n    1: 'Ist die Dämmschichtdicke aus technischen Gründen begrenzt, gilt die Anforderung als erfüllt, wenn die nach den anerkannten Regeln der Technik höchstmögliche Dämmschichtdicke mit λ = 0,035 W/(mK) eingebaut wird (in Hohlräume eingeblasene Dämmstoffe und nachwachsende Rohstoffe: λ = 0,045 W/(mK)). Bei Nr. 5b gilt das auch für Zwischensparrendämmung, wenn die Dicke durch innenseitige Bekleidung oder Sparrenhöhe begrenzt ist.',\n    2: 'Entfällt, wenn die Außenwand nach dem 31.12.1983 unter energiesparrechtlichen Vorschriften errichtet oder erneuert wurde.',\n    5: 'Entfällt, wenn die Bauteilfläche nach dem 31.12.1983 unter energiesparrechtlichen Vorschriften errichtet oder erneuert wurde.'\n  },\n  // Anlage 1: Referenzgebäude (Wohngebäude), U-Werte nur zur Orientierung – Nachweis über H'T (§ 16)\n  ref: {\n    aussenwand: { u:0.28, text:'Außenwand, Geschossdecke gegen Außenluft' },\n    dach:       { u:0.20, text:'Dach, oberste Geschossdecke, Wände zu Abseiten' },\n    erdreich:   { u:0.35, text:'Bauteile gegen Erdreich oder unbeheizte Räume, Bodenplatte' }\n  }\n};\n\n// Mindest-Wärmedurchlasswiderstände R_min [m²K/W] – R ohne R_si/R_se\n// DIN 4108-2, Tabelle 3 – G (2026-05-Werte: Platzhalter = 2013er, unbedingt prüfen!)\nconst R_MIN = {\n  // 2013-02 geprüft am 22.11.2026 gegen Abschrift XLStatik.de „Mindestwärmeschutz nach\n  // DIN 4108-2:2013-02, Tab. 3“, Rev. 1 vom 01.04.2019 (CC0). Fußnote c (0,55 bei niedrig\n  // beheizten Räumen) steht dort nur bei Zeile 1 (Wände) – alle anderen Zeilen gelten unverändert.\n  '2013-02': {\n    normal: {\n      aussenwand:      { rmin:1.20, zeile:'1',       text:'Wände beheizter Räume gegen Außenluft/Erdreich/unbeheizt', geprueft:'22.11.2026' },\n      dach:            { rmin:1.20, zeile:'2 / 3.1', text:'Dachschrägen, Decken nach oben und Flachdächer gegen Außenluft', geprueft:'22.11.2026' },\n      decke_aussen:    { rmin:1.75, zeile:'4.1',     text:'Decken nach unten gegen Außenluft, Tiefgarage, Durchfahrt', geprueft:'22.11.2026' },\n      decke_unbeheizt: { rmin:0.90, zeile:'3.3',     text:'Decken nach oben zu nicht beheizten Räumen', geprueft:'22.11.2026' },\n      kellerdecke:     { rmin:0.90, zeile:'4.2 / 4.3', text:'Decke gegen unbeheizten Keller / Sohlplatte gegen Erdreich', geprueft:'22.11.2026' }\n    },\n    niedrig: {\n      aussenwand:      { rmin:0.55, zeile:'1 (Fn. c)', text:'Wände niedrig beheizter Räume', geprueft:'22.11.2026' },\n      dach:            { rmin:1.20, zeile:'2 / 3.1', text:'Dachschrägen, Decken nach oben und Flachdächer gegen Außenluft', geprueft:'22.11.2026' },\n      decke_aussen:    { rmin:1.75, zeile:'4.1',     text:'Decken nach unten gegen Außenluft, Tiefgarage, Durchfahrt', geprueft:'22.11.2026' },\n      decke_unbeheizt: { rmin:0.90, zeile:'3.3',     text:'Decken nach oben zu nicht beheizten Räumen', geprueft:'22.11.2026' },\n      kellerdecke:     { rmin:0.90, zeile:'4.2 / 4.3', text:'Decke gegen unbeheizten Keller / Sohlplatte gegen Erdreich', geprueft:'22.11.2026' }\n    }\n  },\n  '2026-05': {\n    normal: {\n      aussenwand:      { rmin:1.20, zeile:'?', text:'Außenwände – Werte 2026 prüfen!' },\n      dach:            { rmin:1.20, zeile:'?', text:'Dach – Werte 2026 prüfen!' },\n      decke_aussen:    { rmin:1.75, zeile:'?', text:'Decke – Werte 2026 prüfe ch p_s = 1700 Pa\n// (Außenwände, Decken gegen Dachraum) bzw. 2000 Pa (Dächer). R_si = 0,25, R_se = 0,04.\n// Grenzwerte: M_c ≤ M_ev; M_c ≤ 1,0 kg/m² (0,5 kg/m² an kapillar nicht wasseraufnahmefähigen Schichten).\nconst GLASER = {\n  rsi: 0.25, rse: 0.04,\n  tau: { ti: 20, phiI: 0.50, te: -5, phiE: 0.80, stunden: 2160 },\n  verd: { pI: 1200, pE: 1200, psWand: 1700, psDach: 2000, stunden: 2160 },\n  delta0: 2.0e-10,       // Wasserdampf-Diffusionsleitkoeffizient der Luft [kg/(m·s·Pa)] – Z (Abschn. 3.2)\n  mcMax: 1.0, mcMaxNichtKapillar: 0.5\n};\n\n<\/script>\r\n<script>\n'use strict';\r\n/* Wärmeschutz-Rechner – Berechnungskern */\r\n\r\n// ── Formatierung (Komma als Dezimaltrennzeichen) ──────────────\r\n// R_si/R_se für den U-Wert je Wärmestromrichtung und Außenseite (siehe AUSSENSEITE in data.js)\r\nfunction uebergang(richtung, aussenseite) {\r\n  const r = RSI_RSE[richtung];\r\n  const rse = aussenseite === 'erdreich' ? 0 : aussenseite === 'innen' ? r.rsi : r.rse;\r\n  return { rsi: r.rsi, rse };\r\n}\r\nfunction fmtR(v)  { return v.toFixed(3).replace('.',','); }\r\nfunction fmtU(v)  { return v.toFixed(2).replace('.',','); }\r\nfunction fmtT(v)  { return v.toFixed(1).replace('.',','); }\r\nfunction fmtDU(v) { return v.toFixed(4).replace('.',','); }\r\nfunction fmtQ(v)  { return v.toFixed(2).replace('.',','); }\r\nfunction fmtEta(v){ return v.toFixed(2).replace('.',','); }\r\n\r\n// ── Luftschicht-R (lineare Interpolation) ─────────────────────\r\nfunction luftR(dMm, richtung) {\r\n  const tab = LUFT_R[richtung];\r\n  if (!tab || dMm <= 0) return 0;\r\n  if (dMm >= tab[tab.length-1][0]) return tab[tab.length-1][1];\r\n  for (let i = 0; i < tab.length-1; i++) {\r\n    if (dMm >= tab[i][0] && dMm <= tab[i+1][0]) {\r\n      const [d0,r0] = tab[i], [d1,r1] = tab[i+1];\r\n      return d0 === d1 ? r0 : r0 + (r1-r0)*(dMm-d0)/(d1-d0);\r\n    }\r\n  }\r\n  return 0;\r\n}\r\n\r\n// ── R einer Schicht ───────────────────────────────────────────\r\nfunction schichtR(s, richtung) {\r\n  if (s.typ === 'luft_ruhend') return luftR(s.d * 10, richtung);\r\n  if (!(s.d > 0) || !(s.lambda > 0)) return 0;   // Folien ohne λ: R vernachlässigbar\r\n  return (s.d / 100) / s.lambda;\r\n}\r\n\r\n// ── Inhomogene Schicht (Ober-/Untergrenze DIN EN ISO 6946 §6.2) ─\r\nfunction inhomogenRT(schichten, rsi, rse, richtung, inh) {\r\n  const idx = inh.schichtNr - 1;\r\n  if (idx < 0 || idx >= schichten.length) return null;\r\n\r\n  const dM = schichten[idx].d / 100;\r\n  const Ra = dM / schichten[idx].lambda;\r\n  const Rb = dM / inh.lambdaB;\r\n\r\n  let RHom = 0;\r\n  for (let i = 0; i < schichten.length; i++) {\r\n    if (i !== idx) RHom += schichtR(schichten[i], richtung);\r\n  }\r\n\r\n  // Oberer Grenzwert: 1/R'_T = f_a/R_T,a + f_b/R_T,b\r\n  const RTa = rsi + RHom + Ra + rse;\r\n  const RTb = rsi + RHom + Rb + rse;\r\n  const RTOben = 1 / (inh.fa/RTa + inh.fb/RTb);\r\n\r\n  // Unterer Grenzwert: äquivalenter R der inhomogenen Schicht\r\n  const RjEq = 1 / (inh.fa/Ra + inh.fb/Rb);\r\n  const RTUnten = rsi + RHom + RjEq + rse;\r\n\r\n  const RT = (RTOben + RTUnten) / 2;\r\n  const verh = RTOben / RTUnten;\r\n\r\n  return { RTOben, RTUnten, RT, verh, gueltig: verh <= 1.5, Ra, Rb, RjEq, RHom };\r\n}\r\n\r\n// ── ΔU_g (Luftspalte in Dämmung) ─────────────────────────────\r\nfunction deltaUg(stufe, schichten, RT, richtung, daemmNr) {\r\n  if (stufe === 0 || !daemmNr) return { wert:0, text:'ΔU_g = 0 (Stufe 0)' };\r\n  const idx = daemmNr - 1;\r\n  if (idx < 0 || idx >= schichten.length) return { wert:0, text:'ΔU_g = 0 (Schicht nicht gefunden)' };\r\n\r\n  const RD = schichtR(schichten[idx], richtung);\r\n  const dU = DELTA_UG[stufe] || 0;\r\n  const v = RD / RT;\r\n  const wert = dU * v * v;\r\n  return {\r\n    wert,\r\n    text: `ΔU_g = ΔU″ × (R_Dämmung / R_T)²\\n     = ${fmtDU(dU)} × (${fmtR(RD)} / ${fmtR(RT)})²\\n     = ${fmtDU(wert)} W/(m²K)`\r\n  };\r\n}\r\n\r\n// ── ΔU_f (Befestigungselemente), Näherungsverfahren Schneider 26, Tafel 4.6a ─\r\n// ΔU_f = α·λ_f·n_f·A_f/d₀ · (R₁/R_T,h)²  mit α = 0,8·d₁/d₀ (volle Durchdringung: d₁ = d₀)\r\nfunction deltaUf(bef, schichten, richtung, RT) {\r\n  if (!bef || !bef.nf || !bef.durchmesser || !bef.lambdaF) return { wert:0, text:'ΔU_f = 0 (keine Befestigungselemente)' };\r\n  const idx = (bef.daemmNr || 1) - 1;\r\n  const s = idx >= 0 && idx < schichten.length ? schichten[idx] : null;\r\n  const d0 = s ? s.d / 100 : 0;\r\n  if (d0 <= 0) return { wert:0, text:'ΔU_f = 0 (Dämmdicke ≤ 0)' };\r\n\r\n  const d1 = bef.volleDurchdringung || !(bef.d1 > 0) ? d0 : Math.min(bef.d1 / 100, d0);\r\n  const alpha = ALPHA_BEF * d1 / d0;\r\n  const Af = Math.PI / 4 * Math.pow(bef.durchmesser / 1000, 2);\r\n  const R1 = schichtR(s, richtung);\r\n  const v = R1 / RT;\r\n  const wert = alpha * bef.lambdaF * bef.nf * Af / d0 * v * v;\r\n  return {\r\n    wert,\r\n    text: `α = 0,8 · d₁/d₀ = 0,8 · ${fmtR(d1)} / ${fmtR(d0)} = ${fmtR(alpha)}\\n` +\r\n          `ΔU_f = α · λ_f · n_f · A_f / d₀ · (R₁ / R_T,h)²\\n` +\r\n          `     = ${fmtR(alpha)} · ${fmtR(bef.lambdaF)} · ${fmtR(bef.nf)} · ${fmtDU(Af)} / ${fmtR(d0)} · (${fmtR(R1)} / ${fmtR(RT)})²\\n` +\r\n          `     = ${fmtDU(wert)} W/(m²K)`\r\n  };\r\n}\r\n\r\n// ── ΔU_r (Umkehrdach) nach DIN 4108-2, Schneider 26, Tafel 4.6b ─\r\n// Anteil (R_T − R_i)/R_T: < 10 % → 0,05; 10 bis 50 % → 0,03; > 50 % → 0,00\r\nfunction deltaUrTafel(Ri, RT) {\r\n  const anteil = (RT - Ri) / RT * 100;\r\n  const wert = anteil < 10 ? 0.05 : anteil <= 50 ? 0.03 : 0;\r\n  return {\r\n    wert, anteil,\r\n    text: `ΔU_r nach Tafel 4.6b: (R_T − R_i) / R_T = (${fmtR(RT)} − ${fmtR(Ri)}) / ${fmtR(RT)} = ${anteil.toFixed(1).replace('.', ',')} %\\n` +\r\n          `     → ΔU_r = ${fmtDU(wert)} W/(m²K)`\r\n  };\r\n}\r\n\r\n// ── Temperaturverlauf ─────────────────────────────────────────\r\nfunction temperaturverlauf(schichtenR, rsi, rse, RT, ti, te) {\r\n  const q = (ti - te) / RT;\r\n  const p = [];\r\n  let sR = 0;\r\n\r\n  p.push({ stelle:'Innenluft θ_i',          sR:0,  theta:ti });\r\n  sR += rsi;\r\n  p.push({ stelle:'Innere Oberfläche θ_si', sR,    theta: ti - q*sR });\r\n\r\n  const n = schichtenR.length;\r\n  for (let i = 0; i < n; i++) {\r\n    sR += schichtenR[i].R;\r\n    const nach = 'nach ' + (schichtenR[i].name || 'Schicht '+(i+1));\r\n    p.push({ stelle: i === n-1 ? nach + ' = äußere Oberfläche θ_se' : nach, sR, theta: ti - q*sR });\r\n  }\r\n\r\n  sR += rse;\r\n  p.push({ stelle:'Außenluft θ_e (Kontrolle)', sR, theta: ti - q*sR, kontrolle:true });\r\n\r\n  return { q, punkte:p };\r\n}\r\n\r\n// ── Mindestwärmeschutz ────────────────────────────────────────\r\nfunction pruefeMin(bauteilId, raum, Rvorh, din) {\r\n  const bt = BAUTEILE.find(b => b.id === bauteilId);\r\n  if (!bt) return null;\r\n  const tab = (R_MIN[din] || {})[raum === 'niedrig' ? 'niedrig' : 'normal'];\r\n  if (!tab) return null;\r\n  const ref = tab[bt.rminKey];\r\n  if (!ref) return null;\r\n  const eta = ref.rmin / Rvorh;\r\n  return { rmin:ref.rmin, Rvorh, eta, ok: Rvorh >= ref.rmin, text:ref.text, zeile:ref.zeile, din, geprueft: ref.geprueft || '' };\r\n}\r\n\r\n// ── GModG: § 36 / Anlage 7 (Bestand) bzw. Referenzgebäude Anlage 1 (Neubau) ─\r\nfunction pruefeGModG(fall, bauteilId, zeileId, raum, U) {\r\n  if (fall === 'keine') return null;\r\n  const bt = BAUTEILE.find(b => b.id === bauteilId);\r\n  if (!bt) return null;\r\n  const Ur = Math.round(U * 100) / 100;   // Vergleich mit dem auf 2 Stellen gerundeten U-Wert\r\n  if (fall === 'neubau') {\r\n    const r = GMODG.ref[bt.refKey];\r\n    return { fall, U, Ur, umax: r.u, text: r.text, ok: Ur <= r.u };\r\n  }\r\n  const z = GMODG.anl7.find(x => x.id === zeileId && bt.anl7.includes(x.id)) || GMODG.anl7.find(x => x.id === bt.anl7[0]);\r\n  const umax = raum === 'niedrig' ? z.niedrig : z.hoch;\r\n  return { fall, U, Ur, umax, zeile: z, zone: raum === 'niedrig' ? '12 bis < 19 °C' : '≥ 19 °C',\r\n           keineAnforderung: umax === null, ok: umax === null || Ur <= umax };\r\n}\r\n\r\n// ── Taupunkttemperatur, Näherungsgleichung Schneider 26, Tafel 4.24 ─\r\n// θ_s = (φ·0,01)^0,1247 · (109,8 + θ) − 109,8   (φ in %)\r\nfunction taupunkt(theta, phi) {\r\n  return Math.pow(phi * 0.01, 0.1247) * (109.8 + theta) - 109.8;\r\n}\r\n\r\n// ── Schimmelnachweis (Schneider 26, S. 4.24): Schimmelpilzschwelle ─\r\n// θ_si,min = Taupunkt bei φ_i,O = φ_i / 0,8 = 1,25·φ_i; 20 °C / 50 % → 62,5 % → 12,6 °C\r\n// aussenseite 'erdreich': R_se = 0,00 (Schneider 26, Tafel 4.4a, Zeile „Gegen Erdreich“);\r\n// belüftete Luftschicht ('innen') bleibt bei R_se 0,04 – kleiner als R_si, also auf der sicheren Seite\r\nfunction pruefeSchimmel(R, aussenseite) {\r\n  const S = aussenseite === 'erdreich' ? { ...SCHIMMEL, rse: SCHIMMEL.rseErdreich } : SCHIMMEL;\r\n  const RT = S.rsi + R + S.rse;\r\n  const fRsi = 1 - S.rsi / RT;\r\n  const thetaSi = S.ti - (S.ti - S.te) * S.rsi / RT;\r\n  const phiO = S.phi / S.phiKapillar;\r\n  const thetaMin = Math.round(taupunkt(S.ti, phiO) * 10) / 10;\r\n  const erfR = S.rsi * (S.ti - S.te) / (S.ti - thetaMin) - (S.rsi + S.rse);\r\n  const erfU = (1 / S.rsi) * (S.ti - thetaMin) / (S.ti - S.te);\r\n  return { ...S, R, RT, fRsi, thetaSi, phiO, thetaMin, erfR, erfU, ok: Math.round(thetaSi * 10) / 10 >= thetaMin };\r\n}\r\n\r\n// ── Feuchteschutz: Glaser-Verfahren (DIN 4108-3) ──────────────\r\n// Sättigungsdampfdruck [Pa] (Magnus-Formel, DIN 4108-3)\r\nfunction psat(theta) {\r\n  return theta >= 0 ? 610.5 * Math.exp(17.269 * theta / (237.3 + theta))\r\n                    : 610.5 * Math.exp(21.875 * theta / (265.5 + theta));\r\n}\r\n\r\n// schichten: { d [cm], lambda, mu, typ }, Grenzfläche k = 0 (innen) … n (außen)\r\nfunction glaser(schichten, richtung, dach) {\r\n  const G = GLASER, n = schichten.length;\r\n  const R = schichten.map(s => schichtR(s, richtung));\r\n  const sd = schichten.map(s => s.mu * s.d / 100);\r\n  const x = [0]; sd.forEach(v => x.push(x[x.length-1] + v));\r\n  const Sd = x[n];\r\n  const RT = G.rsi + R.reduce((a, v) => a + v, 0) + G.rse;\r\n  const Rk = [G.rsi]; R.forEach(v => Rk.push(Rk[Rk.length-1] + v));\r\n  const temp = (ti, te) => Rk.map(r => ti - (ti - te) * r / RT);\r\n  const sek = h => h * 3600;\r\n\r\n  // Tauperiode\r\n  const T = G.tau;\r\n  const theta = temp(T.ti, T.te), ps = theta.map(psat);\r\n  const pi = T.phiI * psat(T.ti), pe = T.phiE * psat(T.te);\r\n\r\n  // Gespannter Faden = untere konvexe Hülle von (0|p_i), p_sat der inneren Grenzflächen, (S_d|p_e)\r\n  const pkt = [{ x: 0, p: pi, k: -1 }];\r\n  for (let k = 1; k < n; k++) pkt.push({ x: x[k], p: ps[k], k });\r\n  pkt.push({ x: Sd, p: pe, k: n + 1 });\r\n  const huelle = [];\r\n  for (const q of pkt) {\r\n    while (huelle.length >= 2) {\r\n      const a = huelle[huelle.length-2], b = huelle[huelle.length-1];\r\n      if ((b.x - a.x) * (q.p - a.p) - (b.p - a.p) * (q.x - a.x) <= 0) huelle.pop(); else break;\r\n    }\r\n    huelle.push(q);\r\n  }\r\n  const g = huelle.slice(1).map((b, j) => G.delta0 * (huelle[j].p - b.p) / (b.x - huelle[j].x));\r\n  const ebenen = huelle.slice(1, -1).map((h, j) => ({ ...h, theta: theta[h.k], mc: (g[j] - g[j+1]) * sek(T.stunden) }));\r\n  const mc = ebenen.reduce((a, e) => a + e.mc, 0);\r\n\r\n  // Verdunstungsperiode mit festen Dampfdrücken (Tafel 4.29b), Fälle nach Tafel 4.30\r\n  let verd = null, mev = 0;\r\n  if (ebenen.length) {\r\n    const V = G.verd, d0 = G.delta0, tev = sek(V.stunden);\r\n    const pc = dach ? V.psDach : V.psWand;\r\n    const a = ebenen[0], b = ebenen[ebenen.length-1];\r\n    verd = { pc, piV: V.pI, peV: V.pE, dach, tev };\r\n    if (ebenen.length === 1) {                       // Fall 2: eine Tauwasserebene\r\n      verd.fall = 2;\r\n      verd.gI = d0 * (pc - V.pI) / a.x;\r\n      verd.gE = d0 * (pc - V.pE) / (Sd - a.x);\r\n      verd.xA = verd.xB = a.x;\r\n      mev = (verd.gI + verd.gE) * tev;\r\n    } else if (ebenen.length === 2) {                // Fall 3: zwei Tauwasserebenen\r\n      verd.fall = 3;\r\n      const g1 = d0 * (pc - V.pI) / a.x, g2 = d0 * (pc - V.pE) / (Sd - b.x);\r\n      const t1 = a.mc / g1, t2 = b.mc / g2;\r\n      Object.assign(verd, { gI: g1, gE: g2, t1, t2, xA: a.x, xB: b.x });\r\n      if (t1 > tev && t2 > tev) { verd.variante = 'beide'; mev = (g1 + g2) * tev; }\r\n      else if (t1 < t2) {   // Ebene 1 trocknet zuerst, danach verdunstet Ebene 2 auch nach innen\r\n        verd.variante = 't1'; verd.g2i = d0 * (pc - V.pI) / b.x;\r\n        mev = g1 * t1 + g2 * t1 + (verd.g2i + g2) * (tev - t1);\r\n      } else {\r\n        verd.variante = 't2'; verd.g1e = d0 * (pc - V.pE) / (Sd - a.x);\r\n        mev = g2 * t2 + g1 * t2 + (g1 + verd.g1e) * (tev - t2);\r\n      }\r\n    } else {                                         // Fall 4: Tauwasserbereich\r\n      verd.fall = 4;\r\n      const xm = a.x + 0.5 * (b.x - a.x);\r\n      Object.assign(verd, { xA: a.x, xB: b.x, xm });\r\n      verd.gI = d0 * (pc - V.pI) / xm;\r\n      verd.gE = d0 * (pc - V.pE) / (Sd - xm);\r\n      mev = (verd.gI + verd.gE) * tev;\r\n    }\r\n  }\r\n\r\n  // Grenze M_c: 1,0 kg/m²; Holz ≤ 5 %, Holzwerkstoffe ≤ 3 % der flächenbezogenen Masse\r\n  // der an die Tauwasserebene grenzenden Schicht (Schneider 26, Abschn. 3.5.1 und Beispiel S. 4.31)\r\n  const holz = [];\r\n  ebenen.forEach(e => [schichten[e.k-1], schichten[e.k]].forEach(s => {\r\n    if (s && s.holz && s.rho && !holz.some(h => h.s === s))\r\n      holz.push({ s, name: s.name, anteil: s.holz, rho: s.rho, d: s.d / 100, grenze: s.holz * s.d / 100 * s.rho });\r\n  }));\r\n  const mcGrenze = Math.min(G.mcMax, ...holz.map(h => h.grenze));\r\n  const okMc = mc <= mcGrenze, okEv = mev >= mc;\r\n  return { n, sd, x, Sd, R, RT, theta, ps, pi, pe, huelle, g, ebenen, mc, mev, verd, holz, mcGrenze,\r\n           mus: schichten.map(s => s.mu),\r\n           tauwasser: ebenen.length > 0, okMc, okEv, ok: !ebenen.length || (okMc && okEv) };\r\n}\r\n\r\n// μ-Wahl nach Tafel 4.29a: bei zwei Werten den, der M_c maximiert – vor dem Taupunkt den\r\n// kleineren, dahinter den größeren. Geprüft wird jede Trennstelle; dieselben μ gelten für\r\n// Tau- und Verdunstungsperiode. schichten[j].muMin/muMax optional (sonst fest s.mu).\r\nfunction glaserUnguenstig(schichten, richtung, dach) {\r\n  const n = schichten.length;\r\n  const lo = schichten.map(s => s.muMin !== undefined ? s.muMin : s.mu);\r\n  const hi = schichten.map(s => s.muMax !== undefined ? s.muMax : s.mu);\r\n  let best = null;\r\n  for (let t = n; t >= 0; t--) {\r\n    const mit = schichten.map((s, j) => ({ ...s, mu: j < t ? lo[j] : hi[j] }));\r\n    const g = glaser(mit, richtung, dach);\r\n    if (!best || g.mc > best.mc + 1e-12) best = { ...g, trennstelle: t };\r\n  }\r\n  best.bereich = schichten.map((s, j) => lo[j] !== hi[j]);\r\n  return best;\r\n}\r\n\r\n// ── Plausibilitätschecks ──────────────────────────────────────\r\nfunction plausChecks(U, bauteilId, schichtenR) {\r\n  const out = [];\r\n  const bt = BAUTEILE.find(b => b.id === bauteilId);\r\n  const typK = bt ? bt.rminKey : null;\r\n  const typ = typK ? U_TYPISCH[typK] : null;\r\n  if (typ) {\r\n    const ok = U >= typ.min && U <= typ.max;\r\n    out.push({ ok, text:`U = ${fmtU(U)} W/(m²K) – typischer Bereich ${typ.text}: ${fmtU(typ.min)}…${fmtU(typ.max)} W/(m²K)`, hinweis: ok ? 'plausibel' : 'außerhalb – Eingaben prüfen!' });\r\n  }\r\n  if (schichtenR.length) {\r\n    let mx = 0, mi = 0;\r\n    schichtenR.forEach((s,i) => { if (s.R > mx) { mx = s.R; mi = i; } });\r\n    const n = schichtenR[mi].name || 'Schicht '+(mi+1);\r\n    out.push({ ok:true, text:`Größter R: ${n} mit R = ${fmtR(mx)} m²K/W → hier größter Temperaturabfall.`, hinweis:'Prüfmerkmal OK' });\r\n  }\r\n  return out;\r\n}\r\n\r\n// ── Übergabe an die Heizlast-App (gemeinsames Format „fh21.bauteile“) ──\r\n// Gleicher localStorage-Schlüssel in beiden Apps; funktioniert nur bei gleicher Herkunft\r\n// (z. B. beide unter maikweeting-tech.github.io). Sonst JSON-Datei.\r\nconst FH21_BAUTEILE_KEY = 'fh21.bauteile';\r\nfunction heizlastBauteil(e, name, artLabel, datumIso) {\r\n  const U = Math.round(e.U * 1000) / 1000;\r\n  const tag = datumIso.slice(0, 10).split('-').reverse().join('.');\r\n  return {\r\n    id: 'ws-' + datumIso.replace(/\\D/g, '').slice(0, 14),\r\n    name, art: artLabel, artId: e.bauteilId, U,\r\n    quelle: `Wärmeschutz-App, Bauteil „${name}“, U nach DIN EN ISO 6946 inkl. ΔU (${tag})`,\r\n    datum: datumIso,\r\n    schichten: e.sR.map(s => ({ name: s.name, d: s.d, lambda: s.lambda, R: Math.round(s.R * 1000) / 1000, quelle: s.quelle || '' })),\r\n    // Schichten ohne belegte Quelle (λ aus dem Gedächtnis „ungeprüft“, eigene Eingabe ohne Quelle, Luftschicht-Tabelle)\r\n    ungeprueft: e.sR.filter(s => s.typ === 'luft_ruhend' || !s.quelle || s.quelle === 'ungeprüft')\r\n      .map(s => (s.typ === 'luft_ruhend' ? 'Luftschicht (R aus Tabelle, ungeprüft)' : (s.name || 'Schicht ohne Namen'))),\r\n    RT: Math.round(e.RT * 1000) / 1000, dU: Math.round(e.dU * 1000) / 1000,\r\n    nachweis: nachweisKurz(e)\r\n  };\r\n}\r\n// Kurzfassung der Nachweise für die Vorzeigeseite der Heizlast-App\r\nfunction nachweisKurz(e) {\r\n  const r3 = v => (typeof v === 'number' && isFinite(v) ? Math.round(v * 1000) / 1000 : null);\r\n  const m = e.minErg, g = e.gmodg, s = e.schimmel, f = e.feuchte;\r\n  return {\r\n    rb: { ti: r3(e.ti), te: r3(e.te), raum: e.raum || '', richtung: e.richtung || '', aussenseite: e.aussenseite || 'luft', rsi: r3(e.rsi), rse: r3(e.rse) },\r\n    min: m ? { rmin: r3(m.rmin), Rvorh: r3(m.Rvorh), eta: r3(m.eta), ok: !!m.ok, zeile: String(m.zeile || ''), text: String(m.text || ''), din: String(m.din || ''), geprueft: String(m.geprueft || '') } : null,\r\n    gmodg: g ? { fall: g.fall, Ur: r3(g.Ur), umax: r3(g.umax), ok: !!g.ok, keine: !!g.keineAnforderung,\r\n      nr: g.zeile ? g.zeile.id : '', text: g.zeile ? g.zeile.text : (g.text || ''), zone: g.zone || '' } : null,\r\n    schimmel: s ? { thetaSi: r3(s.thetaSi), thetaMin: r3(s.thetaMin), fRsi: r3(s.fRsi), ok: !!s.ok } : null,\r\n    glaser: !f ? null : f.muFehlt ? { muFehlt: f.muFehlt.map(String) }\r\n      : { tauwasser: !!f.tauwasser, mc: r3(f.mc), mev: r3(f.mev), mcGrenze: r3(f.mcGrenze), okMc: !!f.okMc, okEv: !!f.okEv, ok: !!f.ok, ebenen: (f.ebenen || []).length }\r\n  };\r\n}\r\n// Fenster / Außentür ohne Schichten (U_w nach Herstellerangabe bzw. DIN EN ISO 10077)\r\nfunction fensterBauteil(name, art, U, quelle, datumIso) {\r\n  return {\r\n    id: 'ws-' + datumIso.replace(/\\D/g, '').slice(0, 14),\r\n    name, art: art || 'Fenster', artId: art === 'Außentür' ? 'aussentuer' : 'fenster', U: Math.round(U * 1000) / 1000,\r\n    quelle, datum: datumIso, schichten: [], ungeprueft: [], RT: null, dU: null\r\n  };\r\n}\r\n// Liste ergänzen; gleicher Name ersetzt den alten Eintrag\r\nfunction bauteilListeErgaenzen(liste, b) {\r\n  return (Array.isArray(liste) ? liste.filter(x => x.name !== b.name) : []).concat([b]);\r\n}\r\n\n<\/script>\r\n<script>\n/* Begriffe und Formelzeichen für die i-Erklärungen der Wärmeschutz-App.\n   Nur Bedeutung und Herkunft – bewusst KEINE Tabellenwerte. */\n'use strict';\nconst BEGRIFFE = {\n  // Randbedingungen\n  beispiel: { z: '', n: 'Beispiel laden', e: '', t: 'Lädt einen fertigen Schichtaufbau zum Ausprobieren. Danach kannst du alles ändern.' },\n  bauteil: { z: '', n: 'Bauteil', e: '', t: 'Art des Bauteils (Außenwand, Dach, Kellerdecke …). Danach richten sich die Wärmestromrichtung, der Mindestwärmeschutz R_min nach DIN 4108-2 und die Anforderung nach GModG.' },\n  raumnutzung: { z: '', n: 'Raumnutzung', e: '', t: 'Normal beheizt (Innentemperatur ab 19 °C) oder niedrig beheizt (12 bis unter 19 °C). Davon hängen die Anforderungen nach DIN 4108-2 und GModG ab.' },\n  aussenseite: { z: 'R_se', n: 'Außenseite des Bauteils', e: '', t: 'Woran die äußere Oberfläche grenzt. Außenluft: R_se = 0,04 m²K/W. Erdreich: R_se = 0 (kein Wärmeübergang an Luft). Innenraum oder unbeheizter Raum, z. B. Keller unter der Kellerdecke oder Raum unter einer Geschossdecke: R_se = R_si der Wärmestromrichtung (abwärts 0,17). Stark belüftete Luftschicht (z. B. Verblender mit Lüftungsöffnungen, Vorhangfassade): Luftschicht und äußere Schale weglassen und ebenfalls R_se = R_si wählen (DIN EN ISO 6946). Quelle: DIN EN ISO 6946; Schneider 26, Tafel 4.4a. Bei Kellerdecke / Bodenplatte muss die Außenseite gewählt werden.' },\n  richtung: { z: '', n: 'Wärmestromrichtung', e: '', t: 'Richtung, in der die Wärme durch das Bauteil fließt: horizontal (Wand), aufwärts (Dach, Decke nach oben) oder abwärts (Kellerdecke, Boden). Davon hängen die Wärmeübergangswiderstände R_si und R_se ab.' },\n  theta_i: { z: 'θ_i', n: 'Innentemperatur', e: '°C', t: 'Lufttemperatur innen für den Temperaturverlauf durch das Bauteil. Für den Tauwassernachweis nach Glaser gelten die festen Klimarandbedingungen der DIN 4108-3.' },\n  theta_e: { z: 'θ_e', n: 'Außentemperatur', e: '°C', t: 'Lufttemperatur außen für den Temperaturverlauf durch das Bauteil. Nicht verwechseln mit der Norm-Außentemperatur der Heizlast.' },\n  din: { z: '', n: 'Ausgabe DIN 4108-2', e: '', t: 'Welche Ausgabe der DIN 4108-2 für den Mindestwärmeschutz (R_min) gilt. Das GModG verweist ab 2027 auf die Ausgabe 2026-05.' },\n  gmodg: { z: '', n: 'Anforderung GModG', e: '', t: 'Welche Anforderung des Gebäudemodernisierungsgesetzes geprüft wird: Änderung im Bestand (§ 36 mit Anlage 7, Höchstwert U_max), Neubau (Vergleich mit dem Referenzgebäude nach Anlage 1) oder keine Prüfung.' },\n  anl7: { z: '', n: 'Maßnahme (Anlage 7)', e: '', t: 'Zeile der Anlage 7 zum GModG, die zur Baumaßnahme passt (z. B. Außenwand außen gedämmt). Jede Zeile hat ihren eigenen Höchstwert U_max.' },\n  // Schichtaufbau\n  typ: { z: '', n: 'Typ der Schicht', e: '', t: 'Baustoff (mit λ) oder ruhende Luftschicht. Bei der Luftschicht kommt der Wärmedurchlasswiderstand R aus einer Tabelle nach Dicke und Wärmestromrichtung.' },\n  baustoff: { z: '', n: 'Baustoff', e: '', t: 'Auswahl aus der Baustoffliste (Schneider Bautabellen, mit Tafel als Quelle) oder eigener Name mit eige
