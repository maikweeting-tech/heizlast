    fehlt,
    ein(v, pfad, text) { const x = num(v); if (!ok(x)) fehlt.push({ pfad, text: text + ': Eingabe fehlt' }); return x; },
    nw(n, pfad, text) {

      if (!n) { fehlt.push({ pfad, text: text + ': keine Zeile gewählt' }); return NaN; }
      if (!ok(x)) fehlt.push({ pfad: pfad + '.wert', text: text + ': Normwert fehlt' });
      if (!n.quelle || !String(n.quelle).trim()) fehlt.push({ pfad: pfad + '.quelle', text: text + ': Quelle fehlt' });
      if (!n.geprueft) fehlt.push({ pfad: pfad + '.geprueft', text: text + ': nicht als „geprüft“ markiert' });

// ── Raumrechnung ──────────────────────────────────────────────────────────
function rechneRaum(raum, P) {
  const p = pruefer();
  const NWt = P.normwerte;
  const vf = (P.optionen || {}).verfahren;
  const ts = vf === 'dints2020';
  const din = vf === 'din2003' || ts;   // Transmissionsregeln (U, U_equiv) gleich
  const din03 = vf === 'din2003';       // Lüftung nach Laasch
  p.bed(VERFAHREN[vf], 'projekt.verfahren', 'Rechenverfahren im Tab „1 Projekt“ wählen');
  p.bed(nameOd(raum.nr, ''), 'raum.nr', 'Nr. fehlt');
  p.bed(nameOd(raum.name, ''), 'raum.name', 'Raumname fehlt');

  // Standort
  const st = NWt.standorte.find(s => s.id === P.projekt.standortId);
  p.bed(st, 'projekt.standortId', 'Standort im Tab „1 Projekt“ wählen');
  const stn = st ? `Standort „${nameOd(st.name, '?')}“` : 'Standort';
  const te = st ? p.nw(st.te, `nw.st.${st.id}.te`, `θ_e (${stn})`) : NaN;

  // Raumart → θ_int
  const ra = NWt.raumarten.find(r => r.id === raum.raumartId);
  p.bed(ra, 'raum.raumartId', 'Raumart wählen');
  const ran = ra ? `Raumart „${nameOd(ra.name, '?')}“` : 'Raumart';
  const tint = ra ? p.nw(ra.tint, `nw.ra.${ra.id}.tint`, `θ_int (${ran})`) : NaN;

  // Geometrie
  let A, L = NaN, B = NaN, teile = null;
  if (raum.amodus === 'A') A = p.ein(raum.A, 'raum.A', 'Fläche A');

      const Li = p.ein(t.L, `raum.tf.${t.id}.L`, `Teilfläche ${i + 1}: Länge`);
      const Bi = p.ein(t.B, `raum.tf.${t.id}.B`, `Teilfläche ${i + 1}: Breite`);

  else p.bed(raum.flaechen.length > 0, 'raum.flaechen', 'keine Hüllfläche eingetragen (bei innenliegendem Raum ohne Temperaturunterschied: Haken „innenliegend“)');
  raum.flaechen.forEach((fl, i) => {
    const fp = `raum.fl.${fl.id}`;
    const nrT = `Fläche ${i + 1}`;
    const bt = P.bauteile.find(b => b.id === fl.bauteilId);
    p.bed(bt, fp + '.bauteilId', `${nrT}: Bauteil wählen`);
    let U = NaN, dU = NaN;
    if (bt) {
      U = p.ein(bt.U, `bt.${bt.id}.U`, `Bauteil „${nameOd(bt.name, '?')}“: U`);
      dU = p.ein(bt.dUWB, `bt.${bt.id}.dUWB`, `Bauteil „${nameOd(bt.name, '?')}“: ΔU_WB`);
      p.bed(nameOd(bt.quelle, ''), `bt.${bt.id}.quelle`, `Bauteil „${nameOd(bt.name, '?')}“: Quelle des U-Werts fehlt`);
      if (Array.isArray(bt.ungeprueft) && bt.ungeprueft.length)
        p.bed(bt.schichtenGeprueft, `bt.${bt.id}.schichtenGeprueft`, `Bauteil „${nameOd(bt.name, '?')}“: Schichtwerte ohne Quelle (${bt.ungeprueft.join(', ')}) – prüfen und abhaken`);
    }
    const Uc = U + dU;
    // Bruttofläche direkt oder aus Länge × Höhe (sobald eines der beiden Maße eingetragen ist)
    const masz = String(fl.fL == null ? '' : fl.fL).trim() !== '' || String(fl.fH == null ? '' : fl.fH).trim() !== '';
    let fL = NaN, fH = NaN, Ab;

      fL = p.ein(fl.fL, fp + '.fL', `${nrT}: Länge`);

    const An = Ab - Az;
    if (ok(An)) p.bed(An >= 0, fp + '.Az', `${nrT}: Abzug größer als Bruttofläche`);

        Uk = p.ein(fl.Uequiv, fp + '.Uequiv', `${nrT}: U_equiv`);

    fenv = p.nw(NWt.fenv, 'nw.fenv', 'f_env');

  if (ts && minMassgebend) hinweise.push(`Mindestluftwechsel maßgebend: q_V,min − q_V,techn = ${fmt(Vmin, 1)} − ${fmt(qtechn, 1)} = ${fmt(Vmin - qtechn, 1)} m³/h > Leckage ${fmt(qenv, 1)} m³/h. Wird die Mindestluft von der Lüftungsanlage geliefert, n_min für diesen Raum festlegen (z. B. 0) und begründen.`);

    w: { A, L, B, teile, hi, V, te, tint, dth, tme, fg1, Gw, rhocp, Vsu, tsu, eta, fsu, Vex, n50, e: eW, eps: epsW, Vinf, Vmin, nmin, Vmech, Vroh, Vtherm, minMassgebend,

}

      geb.phiV = fGeb * geb.PhiVenv + geb.PhiVsu + geb.PhiVtr;

if (typeof module !== 'undefined') module.exports = { BEGRIFFE };

/* Heizlast-App – Gebäudeschnitt (Skizze, ohne Maßstab).
   Zeigt die Geschosse (von oben nach unten) und an jeder Stelle die Bauteile aus dem Katalog,
   die dort liegen. Stellen ohne Bauteil werden rot als „nicht benannt“ markiert. */

// num/ok aus calc.js (im Browser im selben Skript, in Node per require)
const SN = (typeof module !== 'undefined' && typeof num === 'undefined') ? require('./calc.js') : { num, ok };

// Lage eines Bauteils im Schnitt
const LAGEN = {
  dach: 'Dach / oberste Decke',
  aussenwand: 'Außenwand',
  fenster: 'Fenster / Außentür',
  geschossdecke: 'Geschossdecke',
  kellerdecke: 'Kellerdecke',
  kelleraussenwand: 'Kelleraußenwand (Erdreich)',
  bodenplatte: 'Bodenplatte (Erdreich)',
  bodenplatte_ok: 'Bodenplatte ohne Keller (Teil des untersten Geschosses auf Erdreich)',
  keine: 'nicht im Schnitt (z. B. Innenwand)'
};

// Vorschlag aus Name und Bauteilart, wenn keine Lage gewählt ist
function lageVorschlag(b) {
  const n = String(b.name || '').toLowerCase(), a = String(b.art || '').toLowerCase(), t = n + ' ' + a;
  if (/innenwand|innentür|innentuer/.test(t)) return 'keine';
  if (/fenster|außentür|aussentür|aussentuer|haustür/.test(t)) return 'fenster';
  if (/dach|oberste geschossdecke|nicht ausg/.test(t)) return 'dach';
  if (/bodenplatte/.test(n)) return 'bodenplatte';
  if (/keller/.test(n) && /wand/.test(n)) return 'kelleraussenwand';
  if (/kellerdecke/.test(n)) return 'kellerdecke';
  if (a === 'bodenplatte') return 'bodenplatte';
  if (a === 'kellerdecke') return 'kellerdecke';
  if (/erdreich/.test(a) && !/decke/.test(n)) return 'bodenplatte';
  if (/decke/.test(t)) return 'geschossdecke';
  if (/wand/.test(t)) return 'aussenwand';
  return 'keine';
}
const lageVon = b => (b.lage && LAGEN[b.lage] ? b.lage : lageVorschlag(b));

function schnittEsc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// Bauteile je Lage: [{ name, uc }]
function bauteileNachLage(bauteile) {
  const m = {};
  Object.keys(LAGEN).forEach(k => { m[k] = []; });
  (bauteile || []).forEach(b => {
    const u = SN.num(b.U) + SN.num(b.dUWB);
    m[lageVon(b)].push({ name: b.name || '(ohne Namen)', uc: SN.ok(u) ? u : null });
  });
  return m;
}

// SVG des Schnitts. G = { geschosse: [{ name, beheizt, keller }] von oben nach unten, dach: '' | 'flach' | 'steil' }
function schnittSvg(G, bauteile, opt = {}) {
  const gs = (G && G.geschosse) || [];
  if (!gs.length) return '';
  const steil = G.dach === 'steil';
  const bl = bauteileNachLage(bauteile);
  const W = 760, xL = 275, xR = 465, h = 62, wand = 7;
  const yTop = steil ? 78 : 34;
  const n = gs.length;
  const nOben = gs.filter(g => !g.keller).length;
  const yG = yTop + nOben * h;                       // Geländeoberkante
  const yBot = yTop + n * h;
  const H = yBot + 46;
  const y = i => yTop + i * h;
  const fmtU = u => (u == null ? '' : ' (U_c ' + u.toFixed(2).replace('.', ',') + ')');
  let s = `<svg class="schnitt" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gebäudeschnitt">
  <defs><pattern id="erde" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#a08060" stroke-width="1.4"/></pattern></defs>
  <style>.sn-t{font:11px Arial,sans-serif;fill:#1f2933}.sn-b{font:bold 11px Arial,sans-serif;fill:#1f2933}.sn-g{font:bold 13px Arial,sans-serif;fill:#1f2933}.sn-k{font:10px Arial,sans-serif;fill:#5b6470}.sn-no{font:italic 11px Arial,sans-serif;fill:#C0392B}</style>`;
  // Erdreich
  s += `<rect x="${xL - 95}" y="${yG}" width="${xR - xL + 190}" height="${H - yG - 6}" fill="url(#erde)" opacity=".55"/><line x1="${xL - 120}" y1="${yG}" x2="${xR + 120}" y2="${yG}" stroke="#6b5440" stroke-width="2"/>`;
  // Geschosse
  gs.forEach((g, i) => {
    const fill = g.keller ? (g.beheizt ? '#f6dcc8' : '#e3e6ea') : (g.beheizt ? '#fde7d6' : '#eceff2');
    s += `<rect x="${xL}" y="${y(i)}" width="${xR - xL}" height="${h}" fill="${fill}"/>`;
    s += `<text x="${(xL + xR) / 2}" y="${y(i) + h / 2 - 2}" text-anchor="middle" class="sn-g">${schnittEsc(g.name || '?')}</text>`;
    s += `<text x="${(xL + xR) / 2}" y="${y(i) + h / 2 + 14}" text-anchor="middle" class="sn-k">${g.beheizt ? 'beheizt' : 'unbeheizt'}${g.keller ? ', unter Gelände' : ''}</text>`;
    // Wände
    const wf = g.keller ? '#7a6a5a' : '#8a5a44';
    s += `<rect x="${xL - wand}" y="${y(i)}" width="${wand}" height="${h}" fill="${wf}"/><rect x="${xR}" y="${y(i)}" width="${wand}" height="${h}" fill="${wf}"/>`;
    // Fenster in Geschossen über Gelände
    if (!g.keller) [xL - wand, xR].forEach(x => { s += `<rect x="${x}" y="${y(i) + 18}" width="${wand}" height="24" fill="#9fd3f0" stroke="#4a8fb8" stroke-width="1"/>`; });
  });
  // Decken (Platten)
  const platte = (yy, farbe) => `<rect x="${xL - wand}" y="${yy - 4}" width="${xR - xL + 2 * wand}" height="8" fill="${farbe}"/>`;
  for (let i = 0; i <= n; i++) s += platte(y(i), i === 0 ? '#5a6470' : i === n ? '#5a5048' : '#7d8790');
  if (steil) s += `<polygon points="${xL - wand - 14},${yTop - 3} ${(xL + xR) / 2},${yTop - 64} ${xR + wand + 14},${yTop - 3}" fill="none" stroke="#5a6470" stroke-width="7" stroke-linejoin="round"/>`;

  // Beschriftungen: links und rechts, Überlappung vermeiden
  const marken = { L: [], R: [] };
  // leer: Text, wenn kein Bauteil benannt ist ('' = rot „nicht benannt“)
  const marke = (seite, lage, ax, ay, titel, leer) => {
    const liste = bl[lage] || [];
    marken[seite].push({ ax, ay, y: ay, titel: titel || LAGEN[lage], zeilen: liste.length ? liste.slice(0, 3).map(b => b.name + fmtU(b.uc)) : null, mehr: Math.max(0, liste.length - 3), leer });
  };
  const ersterOben = gs.findIndex(g => !g.keller);
  const ersterKeller = gs.findIndex(g => g.keller);
  marke('R', 'dach', xR + wand, steil ? yTop - 30 : yTop, G.dach === 'flach' ? 'Flachdach' : steil ? 'Steildach' : 'Dach / oberste Decke');
  if (ersterOben >= 0) {
    marke('L', 'aussenwand', xL - wand, y(ersterOben) + h / 2 + 12);
    marke('R', 'fenster', xR + wand, y(ersterOben) + 30);
  }
  // Geschossdecke: erste Decke zwischen zwei Geschossen über Gelände (oder zwischen zwei Kellern)
  const gd = gs.findIndex((g, i) => i > 0 && !!g.keller === !!gs[i - 1].keller);
  if (gd > 0) marke('R', 'geschossdecke', xR + wand, y(gd));
  if (ersterKeller > 0) marke('R', 'kellerdecke', xR + wand, y(ersterKeller));
  // Unbeheizter Keller: Wand und Sohle gehen nicht in die Heizlast ein – fehlende Bauteile nicht rot
  const kellerKalt = ersterKeller >= 0 && gs.slice(ersterKeller).every(g => g.keller && !g.beheizt);
  const kaltTxt = kellerKalt ? 'nicht nötig (Keller unbeheizt)' : '';
  if (ersterKeller >= 0) marke('L', 'kelleraussenwand', xL - wand, y(ersterKeller) + h / 2, null, kaltTxt);
  marke('L', 'bodenplatte', xL, yBot, ersterKeller >= 0 ? 'Bodenplatte Keller (Erdreich)' : 'Bodenplatte (Erdreich)', ersterKeller >= 0 ? kaltTxt : '');
  // Teilunterkellerung: Bodenplatte des untersten Geschosses über Gelände, wo kein Keller ist
  if (ersterKeller >= 0 && (bl.bodenplatte_ok || []).length) {
    s += `<rect x="${xL - wand - 24}" y="${y(ersterKeller) - 4}" width="24" height="8" fill="#5a5048"/>`;
    marke('L', 'bodenplatte_ok', xL - wand - 12, y(ersterKeller), 'Bodenplatte ohne Keller (Erdreich)');
  }

  const zeileH = 13;
  ['L', 'R'].forEach(seite => {
    const m = marken[seite].sort((a, b) => a.ay - b.ay);
    let frei = 12;
    m.forEach(k => {
      const hoehe = (1 + (k.zeilen ? k.zeilen.length + (k.mehr ? 1 : 0) : 1)) * zeileH;
      k.y = Math.max(k.ay - hoehe / 2 + 4, frei);
      frei = k.y + hoehe + 6;
    });
    m.forEach(k => {
      const tx = seite === 'L' ? xL - wand - 30 : xR + wand + 30, anker = seite === 'L' ? 'end' : 'start';
      const ly = k.y + 4;
      s += `<polyline points="${k.ax},${k.ay} ${seite === 'L' ? tx + 6 : tx - 6},${ly}" fill="none" stroke="#5b6470" stroke-width="1"/><circle cx="${k.ax}" cy="${k.ay}" r="2.5" fill="#5b6470"/>`;
      s += `<text x="${seite === 'L' ? tx : tx}" y="${ly}" text-anchor="${anker}" class="sn-b">${schnittEsc(k.titel)}</text>`;
      if (k.zeilen) k.zeilen.forEach((z, j) => { s += `<text x="${tx}" y="${ly + (j + 1) * zeileH}" text-anchor="${anker}" class="sn-t">${schnittEsc(z)}</text>`; });
      else s += `<text x="${tx}" y="${ly + zeileH}" text-anchor="${anker}" class="${k.leer ? 'sn-k' : 'sn-no'}">${k.leer ? schnittEsc(k.leer) : 'nicht benannt'}</text>`;
      if (k.mehr) s += `<text x="${tx}" y="${ly + (k.zeilen.length + 1) * zeileH}" text-anchor="${anker}" class="sn-k">+ ${k.mehr} weitere</text>`;
    });
  });
  s += '</svg>';
  return s;
}

if (typeof module !== 'undefined') module.exports = { LAGEN, lageVorschlag, lageVon, bauteileNachLage, schnittSvg };

</script>

}

const normBadge = n => (n.status === 'geprueft' ? ['ok', '✓ geprüft'] : n.status === 'ersetzt' ? ['pr', 'ersetzt'] : n.status === 'entwurf' ? ['pr', 'Entwurf'] : ['pr', 'prüfen']);
function nachweisText() {

// Gebäudeschnitt: Geschosse (oben → unten) und Dachform, Vorschau mit den benannten Bauteilen
function gebaeudeKarte() {
  const G = S.gebaeude, gs = G.geschosse;
  const z = gs.map((g, i) => {
    const b = `gebaeude.geschosse.#${g.id}`;
    return `<tr><td class="schicht-pfeile"><button class="btn-icon" data-a="gs-hoch" data-id="${g.id}" title="nach oben" ${i ? '' : 'style="visibility:hidden"'}>▲</button><button class="btn-icon" data-a="gs-runter" data-id="${g.id}" title="nach unten" ${i < gs.length - 1 ? '' : 'style="visibility:hidden"'}>▼</button></td>

  f.addEventListener('load', () => {
    f.dataset.geladen = '1';
    try {
      const d = f.contentDocument;
      const hoehe = () => { f.style.height = Math.max(600, d.documentElement.scrollHeight + 4) + 'px'; };

window.addEventListener('message', e => {

          <div class="feld"><span>Quelle ΔU<sub>WB</sub> <span class="einh">(optional)</span></span> ${inp(pb + '.dUWBQuelle', '', 'q', 'placeholder="z. B. DIN 4108 Bbl. 2, Kategorie B"')}</div>

        ${ws ? aufbauHtml(b) : `<label class="aufbau-feld">Aufbau <span class="einh">(innen → außen, optional)</span> ${inp(pb + '.aufbau', '', 'q', 'placeholder="z. B. 1,5 cm Putz · 17,5 cm KS · 18 cm Mineralwolle · Vormauerschale"')}</label>`}

// Schichtaufbau eines Bauteils aus der Wärmeschutz-App (innen → außen)
function aufbauHtml(b) {
  const sch = b.schichten || [];
  if (!sch.length && (b.art === 'Fenster' || b.art === 'Außentür')) return '<span class="klein hinweis">Kein Schichtaufbau: U_w bzw. U_D aus der genannten Quelle. Ändern: im Tab „2 Wärmeschutz“ unter „Fenster oder Außentür übergeben“ mit demselben Namen neu übergeben.</span>';
  const knopf = b.wsZustand
    ? `<button class="btn btn-klein no-print" data-a="ws-bearbeiten" data-id="${b.id}" title="Aufbau mit allen Randbedingungen in den Tab „2 Wärmeschutz“ laden">Im Wärmeschutz bearbeiten</button>`
    : '<span class="klein hinweis no-print">Bearbeiten nicht möglich (Eingaben nicht gespeichert) – im Tab „2 Wärmeschutz“ neu eingeben und unter demselben Namen übergeben.</span>';
  if (!sch.length) return `<span class="klein hinweis">Aufbau nicht gespeichert (vor dem 22.11.2026 übernommen).</span> ${knopf}`;

}
function aufbauTabelle(b, sch) {
  const z = sch.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name) || '–'}</td><td class="zahl">${ok(s.d) ? W(s.d, 1) : '–'}</td><td class="zahl">${ok(s.lambda) ? W(s.lambda, 3) : '–'}</td><td class="zahl">${ok(s.R) ? W(s.R, 3) : '–'}</td><td class="klein">${esc(s.quelle) || '–'}</td></tr>`).join('');

// Wärmeschutznachweise der Bauteile (aus der Wärmeschutz-App übergeben) für die Vorzeigeseite
function bauteilNachweiseHtml() {
  const ws = S.bauteile.filter(b => b.herkunft === 'waermeschutz' && !(b.art === 'Fenster' || b.art === 'Außentür'));
  if (!ws.length) return '';
  const v = (x, d) => (ok(x) ? W(x, d) : '–');
  const ja = (okk, t) => `<span class="${okk ? 'ok' : 'no'}">${okk ? '✓' : '✗'} ${t}</span>`;
  const zeilen = ws.map(b => {
    const n = b.nachweis;
    if (!n) return `<tr><td>${esc(b.name)}</td><td colspan="4"><i>Nachweise nicht übergeben – Bauteil im Tab „2 Wärmeschutz“ berechnen und neu übergeben.</i></td></tr>`;
    const m = n.min, g = n.gmodg, s = n.schimmel, gl = n.glaser;
    const minT = m ? `R = ${v(m.Rvorh, 2)} ≥ R<sub>min</sub> = ${v(m.rmin, 2)}<br>${ja(m.ok, m.ok ? 'erfüllt' : 'nicht erfüllt')}${m.geprueft ? '' : '<br><span class="no">R<sub>min</sub> ungeprüft</span>'}` : '–';
    const gT = !g ? '–' : g.fall === 'neubau' ? `U = ${v(g.Ur, 2)} / U<sub>Ref</sub> = ${v(g.umax, 2)}<br>${ja(g.ok, g.ok ? 'Referenz erreicht' : 'Referenz verfehlt')}`
      : g.keine ? `Anl. 7 Nr. ${esc(g.nr)}: keine Anforderung` : `U = ${v(g.Ur, 2)} ≤ U<sub>max</sub> = ${v(g.umax, 2)} (Anl. 7 Nr. ${esc(g.nr)})<br>${ja(g.ok, g.ok ? 'erfüllt' : 'nicht erfüllt')}`;
    const sT = s ? `θ<sub>si</sub> = ${v(s.thetaSi, 1)} ≥ ${v(s.thetaMin, 1)} °C, f<sub>Rsi</sub> = ${v(s.fRsi, 2)}<br>${ja(s.ok, s.ok ? 'kein Schimmel' : 'Schimmelgefahr')}` : '–';
    const glT = !gl ? '–' : gl.muFehlt ? `μ fehlt: ${esc(gl.muFehlt.join(', '))}`
      : !gl.tauwasser ? `kein Tauwasser<br>${ja(true, 'erfüllt')}`
      : `M<sub>c</sub> = ${v(gl.mc, 3)} ≤ ${v(gl.mcGrenze, 3)} kg/m²<br>M<sub>ev</sub> = ${v(gl.mev, 3)} ≥ M<sub>c</sub><br>${ja(gl.ok, gl.ok ? 'zulässig' : 'unzulässig')}`;
    const AS = { luft: 'Außenluft', erdreich: 'Erdreich', innen: 'R_se = R_si (unbeheizter Raum oder belüftete Luftschicht)' };
    const rb = n.rb ? `<div class="aufbau-kurz">θ<sub>i</sub> ${v(n.rb.ti, 1)} °C / θ<sub>e</sub> ${v(n.rb.te, 1)} °C${m && m.din ? ` · DIN 4108-2:${esc(m.din)}` : ''}${n.rb.aussenseite ? ` · außen: ${esc(AS[n.rb.aussenseite] || n.rb.aussenseite)}${ok(n.rb.rse) ? ` (R<sub>se</sub> ${v(n.rb.rse, 2)})` : ''}` : ''}</div>` : '';
    return `<tr><td>${esc(b.name)}${rb}</td><td>${minT}</td><td>${gT}</td><td>${sT}</td><td>${glT}</td></tr>`;
  }).join('');
  return `<h3 class="rw-raum">Wärmeschutznachweise der Bauteile (aus Tab „2 Wärmeschutz“)</h3>
  <table class="nachweise"><thead><tr><th>Bauteil</th><th>Mindestwärmeschutz DIN 4108-2<br>R in m²K/W</th><th>GModG<br>U in W/(m²·K)</th><th>Schimmel (Fläche)</th><th>Tauwasser Glaser DIN 4108-3</th></tr></thead><tbody>${zeilen}</tbody></table>
  <p style="font-size:7.8pt;color:#5b6470">Ausführliche Rechnung (Temperaturverlauf, Glaser-Diagramm) im Ausdruck der Wärmeschutz-App. Schimmelnachweis für die ungestörte Fläche (θ<sub>i</sub> 20 °C, φ<sub>i</sub> 50 %, θ<sub>e</sub> −5 °C).</p>`;
}

// ── 5 Raumtabelle ─────────────────────────────────────────────────────────
function rTabelle() {
  if (!S.raeume.length) return '<div class="karte"><h2>Raumtabelle</h2><p class="hinweis">Noch keine Räume. Im Tab „5 Raum eingeben“ einen Raum anlegen und „Raum übernehmen“ drücken.</p></div>';

    return `<tr class="${v ? '' : 'unvoll'}"><td><button class="btn-icon" style="color:var(--text)" data-a="auf" data-id="${r.id}" aria-expanded="${o}" title="Rechenweg">${o ? '▾' : '▸'}</button></td>
      <td>${esc(r.nr)}</td><td>${esc(r.name)}</td><td class="zahl">${W(R.w.A, 2)}</td><td class="zahl">${W(R.w.V, 1)}</td><td class="zahl">${W(R.w.tint, 1)}</td>
      <td class="zahl">${W(R.phiT)}</td><td class="zahl">${W(R.phiV)}</td><td class="zahl">${v ? (R.rhGesetzt ? W(R.phiRH) : '–') : '–'}</td><td class="zahl"><b>${W(R.phiHL)}</b></td><td class="zahl">${W(R.phiSpez, 1)}</td>
      <td>${v ? '<span class="status ok">vollständig</span>' : '<span class="status no">unvollständig</span>'}</td>
      <td class="no-print" style="white-space:nowrap"><button class="btn btn-klein" data-a="raum-edit" data-id="${r.id}">Bearbeiten</button>
        <button class="btn btn-klein" data-a="raum-dup" data-id="${r.id}">Duplizieren</button><button class="btn-icon" data-a="raum-weg" data-id="${r.id}" title="Löschen">×</button></td></tr>
      ${o ? `<tr><td></td><td colspan="12">${v ? rwTabelle(R, false) : ''}${raumErgebnisHtml(R)}</td></tr>` : ''}`;
  }).join('');
  const s = G.summe;
  return `<div class="karte"><h2>Raumtabelle</h2><div class="tabwrap"><table class="tab">
    <tr><th></th><th>Nr.</th><th>Raum</th><th class="zahl">A ${info('A')}<br>m²</th><th class="zahl">V ${info('Vi')}<br>m³</th><th class="zahl">θ<sub>int</sub> ${info('theta_int')}<br>°C</th><th class="zahl">Φ<sub>T</sub> ${info('PhiT')}<br>W</th><th class="zahl">Φ<sub>V</sub> ${info('PhiV')}<br>W</th><th class="zahl">Φ<sub>RH</sub> ${info('PhiRH')}<br>W</th><th class="zahl">Φ<sub>HL</sub> ${info('PhiHL')}<br>W</th><th class="zahl">φ ${info('phi')}<br>W/m²</th><th>Status</th><th></th></tr>
    ${z}
    <tr class="summe"><td></td><td></td><td>Summe</td><td class="zahl">${s ? W(s.A, 2) : '–'}</td><td class="zahl">${s ? W(s.V, 1) : '–'}</td><td></td><td class="zahl">${s ? W(s.phiT) : '–'}</td><td class="zahl">${s ? W(s.phiV) : '–'}</td><td class="zahl">${s ? W(s.phiRH) : '–'}</td><td class="zahl">${s ? W(s.phiHL) : '–'}</td><td class="zahl">${s ? W(s.phiSpez, 1) : '–'}</td><td colspan="2">${s ? '' : '<span class="status no">Räume unvollständig</span>'}</td></tr>
    </table></div>
    <div class="ergebnis"><div class="haupt">Gebäudeheizlast ${G.geb && G.geb.ts ? 'Φ<sub>HL,Geb</sub>' : 'Σ Φ<sub>HL</sub>'} ${info('PhiGeb')}<b>${G.geb ? W(G.geb.phiHL / 1000, 2) + ' kW' : '–'}</b></div><div>Nachweis Wärmeerzeuger ${info('eta_nw')}<b style="font-size:.9rem">${esc(nachweisText())}</b></div></div>
    ${gebHinweis()}</div>`;
}
// Herleitung der Gebäudeheizlast (Verfahren DIN/TS: Formblatt G 2 des wbs-Musterbeispiels)
function gebHinweis() {
  const g = G.geb;
  if (!g || !g.ts) return '<p class="hinweis klein">Gebäudeheizlast als Summe der Raumheizlasten ohne Abminderungen.</p>';
  return `<p class="hinweis klein">Φ<sub>HL,Geb</sub> = Σ Φ<sub>T,e</sub> + f<sub>Geb</sub> · Σ Φ<sub>V,env/min</sub> + Σ Φ<sub>V,su</sub> + Σ Φ<sub>V,tr</sub> + Σ Φ<sub>RH</sub>
    = ${W(g.phiTe)} + ${W(g.fGeb, 2)} · ${W(g.PhiVenv)} + ${W(g.PhiVsu)} + ${fmtV(g.PhiVtr, 0)} + ${W(G.summe.phiRH)} = <b>${W(g.phiHL)} W</b>.
    Nicht enthalten: Wärmeströme zwischen beheizten Räumen (${fmtV(g.phiTb, 0)} W). Die Summe der Raumheizlasten (${W(G.summe.phiHL)} W) gilt für die Heizflächen je Raum.</p>`;
}
// Rechenweg-Tabelle wie Folienwerte F2_Rechenweg
function rwTabelle(R, papier) {
  const c = papier ? 'z' : 'zahl';
  const zr = (a, bz, ei, kw, fa, dt, phi, cls = '') => `<tr class="${cls}"><td>${a}</td><td class="${c}">${bz}</td><td>${ei}</td><td class="${c}">${kw}</td><td class="${c}">${fa}</td><td class="${c}">${dt}</td><td class="${c}">${phi}</td></tr>`;
  let h = '';
  R.zeilen.forEach(z => { h += zr(`${esc(z.label)} <small>(${esc(ANGRENZUNG[z.an])}${z.ukName === 'U_equiv' ? ', U_equiv' : ''})</small>`, W(z.bezug, 2), 'm²', W(z.Uk, 3), W(z.f, 3), W(z.dth, 1), `<span class="${z.gewinn ? 'gewinn' : ''}">${W(z.phi)}</span>`); });
  if (R.innenliegend) h += zr('innenliegend – Nachbarräume mit gleicher Temperatur, keine Transmission', '', '', '', '', '', '0');
  h += zr('<b>Σ Transmission Φ<sub>T</sub></b>', '', '', '', '', '', `<b>${W(R.phiT)}</b>`, papier ? 'zw' : 'summe');
  const w = R.w;
  if (R.verfahren === 'dints2020') {
    h += zr(`Leckage q<sub>V,env</sub> = f<sub>env</sub> · q<sub>env,50</sub> · A<sub>env</sub> (A<sub>env</sub> = ${W(w.Aenv, 2)} m²)`, W(w.qenv, 2), 'm³/h', '', '', '', '');
    h += zr(`Mindestluft q<sub>V,min</sub> − q<sub>V,techn</sub> = ${W(w.Vmin, 1)} − ${W(w.qtechn, 1)}${w.Vmin - w.qtechn <= 0 ? ' – von der Anlage gedeckt' : ''}`, W(w.Vmin - w.qtechn, 1), 'm³/h', '', '', '', '');
    h += zr(`q<sub>V,env/min</sub> = max(…)${w.minMassgebend ? ' – Mindestluft maßgebend' : ''}`, W(w.qenvmin, 2), 'm³/h', W(w.rhocp, 2), '1', W(w.dth, 1), W(R.PhiVenv));
    if (w.Vsu > 0) h += zr('Zuluft V̇<sub>su</sub>' + (w.suModus === 'eta' ? ' (WRG)' : '') + ` mit θ<sub>su</sub> = ${W(w.tsu, 1)} °C`, W(w.Vsu, 0), 'm³/h', W(w.rhocp, 2), '1', W(w.tint - w.tsu, 1), W(R.PhiVsu));
    if (w.Vtr > 0) h += zr(`Überströmluft V̇<sub>tr</sub> mit θ<sub>tr</sub> = ${W(w.ttr, 1)} °C`, W(w.Vtr, 0), 'm³/h', W(w.rhocp, 2), '1', W(w.tint - w.ttr, 1), W(R.PhiVtr));
  } else if (R.verfahren === 'din2003') {
    h += zr('Infiltration V̇<sub>inf</sub>', W(w.Vinf, 2), 'm³/h', '', '1', '', '');
    if (w.Vsu > 0) h += zr('Zuluft V̇<sub>su</sub> · f<sub>V,su</sub>' + (w.suModus === 'eta' ? ' (WRG)' : ''), W(w.Vsu, 0), 'm³/h', '', W(w.fsu, 3), '', '');
    if (w.Vmech > 0) h += zr('Abluftüberschuss V̇<sub>mech,inf</sub>', W(w.Vmech, 1), 'm³/h', '', '1', '', '');
    h += zr('Mindestluftwechsel V̇<sub>min</sub> = n<sub>min</sub> · V<sub>i</sub>', W(w.Vmin, 1), 'm³/h', '', '', '', '');
    h += zr(`thermisch wirksam V̇<sub>therm</sub> = max(…)${w.minMassgebend ? ' – V̇<sub>min</sub> maßgebend' : ''}`, W(w.Vtherm, 1), 'm³/h', W(w.rhocp, 2), '1', W(w.dth, 1), W(R.phiV));
  } else {
    if (w.Vsu > 0) h += zr('Lüftung Zuluft' + (w.suModus === 'eta' ? ' mit WRG' : ''), W(w.Vsu, 0), 'm³/h', W(w.rhocp, 2), W(w.fsu, 3), W(w.dth, 1), W(R.PhiVsu));
    h += zr('Infiltration', W(w.Vinf, 1), 'm³/h', W(w.rhocp, 2), '1', W(w.dth, 1), W(R.PhiVinf));
  }
  h += zr('<b>Σ Lüftung Φ<sub>V</sub></b>', '', '', '', '', '', `<b>${W(R.phiV)}</b>`, papier ? 'zw' : 'summe');
  if (R.rhGesetzt) h += w.rhModus === 'fRH' ? zr('Aufheizzuschlag Φ<sub>RH</sub> = A<sub>R</sub> · f<sub>RH</sub>', W(w.A, 2), 'm²', W(w.fRH, 1), '', '', W(R.phiRH)) : zr('Aufheizzuschlag Φ<sub>RH</sub>', '', '', '', '', '', W(R.phiRH));
  h += zr('<b>Norm-Heizlast Φ<sub>HL</sub></b>', '', '', '', '', '', `<b>${W(R.phiHL)}</b>`, papier ? 'ges' : 'summe');
  return `<div class="tabwrap"><table class="tab"><thead><tr><th>Anteil</th><th class="${c}">Bezugsgröße</th><th>Einheit</th><th class="${c}">Kennwert${papier ? '' : ' ' + info('kennwert')}</th><th class="${c}">Faktor${papier ? '' : ' ' + info('f')}</th><th class="${c}">Δθ in K${papier ? '' : ' ' + info('dtheta')}</th><th class="${c}">Φ in W</th></tr></thead><tbody>${h}</tbody></table></div>
    <p class="hinweis klein" style="margin:2px 0 6px">Kennwert: U<sub>c</sub> / U / U<sub>equiv</sub> in W/(m²·K), ρ·c<sub>p</sub> in Wh/(m³·K), f<sub>RH</sub> in W/m². Φ = Bezugsgröße · Kennwert · Faktor · Δθ.</p>`;
}
// Formel → Werte → Ergebnis
function fwZeilen(R) {
  const w = R.w, Z = [];
  const z = (formel, werte, erg) => Z.push([formel, werte, erg]);
  const gr = t => Z.push([t]);
  gr('Grundwerte');
  z('Δθ = θ_int − θ_e', `= ${fmtV(w.tint, 1)} − ${fmtV(w.te, 1)}`, `= ${W(w.dth, 1)} K`);
  if (ok(w.L)) z('A = L · B', `= ${W(w.L, 3)} · ${W(w.B, 3)}`, `= ${W(w.A, 2)} m²`);
  if (w.teile) z(`A = Σ (± L_i · B_i)  (${w.teile.length} Teilflächen)`, '= ' + w.teile.map((t, i) => `${i ? (t.minus ? '− ' : '+ ') : (t.minus ? '− ' : '')}${W(t.L, 3)} · ${W(t.B, 3)}`).join(' '), `= ${W(w.A, 2)} m²`);
  z('V_i = A · h_i', `= ${W(w.A, 2)} · ${W(w.hi, 2)}`, `= ${W(w.V, 2)} m³`);
  gr('Transmission');
  R.zeilen.forEach((t, i) => {
    const k = i + 1;
    if (t.ukName === 'U_c') z(`U_c,${k} = U + ΔU_WB`, `= ${W(t.U, 3)} + ${W(t.dU, 3)}`, `= ${W(t.Uk, 3)} W/(m²·K)`);
    if (t.masz) z(`A_brutto,${k} = L · H`, `= ${W(t.fL, 2)} · ${W(t.fH, 2)}`, `= ${W(t.Ab, 2)} m²`);
    if (t.Az > 0) z(`A_${k} = A_brutto − A_Öffn.`, `= ${W(t.Ab, 2)} − ${W(t.Az, 2)}`, `= ${W(t.bezug, 2)} m²`);
    if (t.fWerte) z(`f_${k} (${ANGRENZUNG[t.an]}): ${t.fText}`, t.fWerte, `= ${W(t.f, 3)}`);
    z(`Φ_T,${k} = A · ${t.ukName} · f · Δθ  (${t.label})`, `= ${W(t.bezug, 2)} · ${W(t.Uk, 3)} · ${W(t.f, 3)} · ${W(t.dth, 1)}`, `= ${W(t.phi, 1)} W`);
  });
  if (R.innenliegend) z('Φ_T (innenliegend, Nachbarräume gleiche Temperatur)', '= 0', '= 0,0 W');
  else z('Φ_T = Σ Φ_T,k', '= ' + R.zeilen.map(t => fmtV(t.phi, 1)).join(' + '), `= ${W(R.phiT, 1)} W`);
  gr('Lüftung');
  if (w.Vsu > 0 && w.suModus === 'eta') z('θ_su = θ_e + η_WRG · (θ_int − θ_e)', `= ${fmtV(w.te, 1)} + ${W(w.eta, 2)} · ${W(w.dth, 1)}`, `= ${W(w.tsu, 2)} °C`);
  if (R.verfahren === 'dints2020') {
    const ae = R.zeilen.filter(t => t.an === 'aussen' || t.an === 'erdreich');
    z('A_env,i = Σ A_k (außen, Erdreich)', '= ' + ae.map(t => W(t.bezug, 2)).join(' + '), `= ${W(w.Aenv, 2)} m²`);
    z('q_V,env,i = f_env · q_env,50 · A_env,i', `= ${W(w.fenv, 3)} · ${W(w.qenv50, 2)} · ${W(w.Aenv, 2)}`, `= ${W(w.qenv, 2)} m³/h`);
    z('q_V,min,i = n_min · V_i' + (w.nminEigen ? '  (n_min raumweise: ' + w.nminQuelle + ')' : ''), `= ${W(w.nmin, 2)} · ${W(w.V, 2)}`, `= ${W(w.Vmin, 2)} m³/h`);
    z('q_V,techn,i = max(V̇_su ; V̇_ex)', `= max(${W(w.Vsu, 0)} ; ${W(w.Vex, 0)})`, `= ${W(w.qtechn, 1)} m³/h`);
    z('q_V,env/min,i = max(q_V,env,i ; q_V,min,i − q_V,techn,i)', `= max(${W(w.qenv, 2)} ; ${W(w.Vmin, 2)} − ${W(w.qtechn, 1)})`, `= ${W(w.qenvmin, 2)} m³/h`);
    z('Φ_V,env = ρ·c_p · q_V,env/min,i · (θ_int − θ_e)', `= ${W(w.rhocp, 2)} · ${W(w.qenvmin, 2)} · ${W(w.dth, 1)}`, `= ${W(R.PhiVenv, 1)} W`);
    z('Φ_V,su = ρ·c_p · V̇_su · (θ_int − θ_su)', w.Vsu > 0 ? `= ${W(w.rhocp, 2)} · ${W(w.Vsu, 0)} · (${fmtV(w.tint, 1)} − ${fmtV(w.tsu, 2)})` : '= 0 (keine Zuluft)', `= ${W(R.PhiVsu, 1)} W`);
    z('Φ_V,tr = ρ·c_p · V̇_tr · (θ_int − θ_tr)', w.Vtr > 0 ? `= ${W(w.rhocp, 2)} · ${W(w.Vtr, 0)} · (${fmtV(w.tint, 1)} − ${fmtV(w.ttr, 1)})` : '= 0 (keine Überströmluft)', `= ${W(R.PhiVtr, 1)} W`);
    z('Φ_V = Φ_V,env + Φ_V,su + Φ_V,tr', `= ${W(R.PhiVenv, 1)} + ${W(R.PhiVsu, 1)} + ${fmtV(R.PhiVtr, 1)}`, `= ${W(R.phiV, 1)} W`);
  } else z('V̇_inf = 2 · V_i · n_50 · e · ε', `= 2 · ${W(w.V, 2)} · ${W(w.n50, 2)} · ${W(w.e, 3)} · ${W(w.eps, 2)}`, `= ${W(w.Vinf, 2)} m³/h`);
  if (R.verfahren === 'dints2020') { /* oben */ } else if (R.verfahren === 'din2003') {
    if (w.Vsu > 0) z('f_V,su = (θ_int − θ_su) / (θ_int − θ_e)', `= (${fmtV(w.tint, 1)} − ${fmtV(w.tsu, 2)}) / ${W(w.dth, 1)}`, `= ${W(w.fsu, 3)}`);
    z('V̇_mech,inf = V̇_ex − V̇_su  (nur Überschuss)', `= max(${W(w.Vex, 0)} − ${W(w.Vsu, 0)} ; 0)`, `= ${W(w.Vmech, 2)} m³/h`);
    z('V̇_min = n_min · V_i', `= ${W(w.nmin, 2)} · ${W(w.V, 2)}`, `= ${W(w.Vmin, 2)} m³/h`);
    z('V̇_therm = max(V̇_inf + V̇_su · f_V,su + V̇_mech,inf ; V̇_min)', `= max(${W(w.Vinf, 2)} + ${W(w.Vsu, 0)} · ${W(w.fsu, 3)} + ${W(w.Vmech, 2)} ; ${W(w.Vmin, 2)})`, `= ${W(w.Vtherm, 2)} m³/h`);
    z('Φ_V = ρ·c_p · V̇_therm · Δθ', `= ${W(w.rhocp, 2)} · ${W(w.Vtherm, 2)} · ${W(w.dth, 1)}`, `= ${W(R.phiV, 1)} W`);
  } else {
    z('Φ_V = ρ·c_p · [V̇_inf · Δθ + V̇_su · (θ_int − θ_su)]', w.Vsu > 0 ? `= ${W(w.rhocp, 2)} · [${W(w.Vinf, 2)} · ${W(w.dth, 1)} + ${W(w.Vsu, 0)} · (${fmtV(w.tint, 1)} − ${fmtV(w.tsu, 2)})]` : `= ${W(w.rhocp, 2)} · [${W(w.Vinf, 2)} · ${W(w.dth, 1)} + 0]`, `= ${W(R.phiV, 1)} W`);
  }
  if (w.rhModus === 'fRH') { gr('Aufheizzuschlag'); z('Φ_RH = A_R · f_RH', `= ${W(w.A, 2)} · ${W(w.fRH, 1)}`, `= ${W(R.phiRH, 1)} W`); }
  gr('Ergebnis');
  z('Φ_HL = Σ Φ_T + Φ_V + Φ_RH', `= ${W(R.phiT, 1)} + ${W(R.phiV, 1)} + ${R.rhGesetzt ? W(R.phiRH, 1) : '0'}`, `= ${W(R.phiHL, 1)} W = ${W(R.phiHL / 1000, 2)} kW`);
  z('φ = Φ_HL / A', `= ${W(R.phiHL, 1)} / ${W(w.A, 2)}`, `= ${W(R.phiSpez, 1)} W/m²`);
  return Z;
}

// Auswahl der Räume für den Rechenweg; alte Projekte mit einem Raum (vorzeigeRaum) werden übernommen
function vorzeigeAuswahl() {
  if (!Array.isArray(S.vorzeigeRaeume)) {
    if (!S.raeume.length) return [];
    S.vorzeigeRaeume = S.raeume.some(r => r.id === S.vorzeigeRaum) ? [S.vorzeigeRaum] : [S.raeume[0].id];
    delete S.vorzeigeRaum;
  }
  const ids = new Set(S.raeume.map(r => r.id));
  S.vorzeigeRaeume = S.vorzeigeRaeume.filter(id => ids.has(id));
  return S.vorzeigeRaeume;
}

  <p><b>Normwerte:</b> Alle in der Rechnung verwendeten Normwerte stehen mit Quelle und Prüfstatus in Abschnitt 1 (Randbedingungen). Einträge der Normwert-Tabelle, die kein Raum verwendet, werden nicht gedruckt.</p>

    else if (typeof v === 'number') { if (ok(v)) ws[ref] = { t: 'n', v }; }
    else ws[ref] = { t: 's', v: String(v) };
  };
  const blatt = (rows, cols) => {
    const ws = {}; let maxC = 0;
    rows.forEach((r, i) => r.forEach((v, j) => { zelle(ws, XLSX.utils.encode_cell({ r: i, c: j }), v); maxC = Math.max(maxC, j); }));
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length - 1, c: maxC } });

  // Bauteile

  // Räume und Hüllflächen
  const hr = [[kopfz[0]], [kopfz[1]], [], ['Raum-Nr.', 'Bauteil', 'Ausrichtung', 'angrenzend an', 'A brutto in m²', 'Abzug in m²', 'A netto in m²', 'U_k (U_c / U / U_equiv) in W/(m²·K)', 'θ_u / θ_j in °C bzw. b_u', 'f in –', 'Δθ in K', 'Φ_T in W']];
